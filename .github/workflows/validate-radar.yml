name: Validate radar changes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe_sources:
        description: "Run read-only official source diagnostics"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: radar-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate Python tests
        run: python -m unittest discover -s tests -v
      - name: Validate refresh planning on production snapshots (read only)
        run: python scripts/plan_refresh.py --event schedule --output /tmp/radar-plan.txt
      - name: Validate JavaScript tests
        run: node --test tests/test_overview.mjs tests/test_scheduler_worker.mjs
      - name: Validate model references and evidence
        run: |
          python scripts/validate_model_links.py
          python scripts/audit_model_completeness.py
          python scripts/check_creator_links.py --dry-run
          python scripts/collect_creator_opportunities.py --dry-run
      - name: Package static Pages artifact without deployment
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: radar-pages-preflight
          path: site
          retention-days: 2
      - name: Detect collector or source configuration changes
        id: probe_needed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(config/(model-sources|cross-platform-sources|release-recall-benchmark)\.json|scripts/collect_(models|cross_platform|resolve_model_leads|release_recall)\.py)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read-only source diagnostics
        if: (github.event_name == 'workflow_dispatch' && inputs.probe_sources) || (github.event_name == 'pull_request' && steps.probe_needed.outputs.run == 'true')
        run: |
          python scripts/collect_models.py --dry-run --report /tmp/radar-source-probe.json
          python scripts/collect_cross_platform.py --dry-run --report /tmp/radar-cross-probe.json
          python scripts/collect_resolve_model_leads.py --dry-run --discovery /tmp/radar-cross-probe.json --report /tmp/radar-proof-probe.json
          python scripts/collect_release_recall.py --dry-run --probe /tmp/radar-source-probe.json --recovery /tmp/radar-proof-probe.json
      - name: Upload source diagnostics
        if: (github.event_name == 'workflow_dispatch' && inputs.probe_sources) || (github.event_name == 'pull_request' && steps.probe_needed.outputs.run == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: source-probe
          path: |
            /tmp/radar-source-probe.json
            /tmp/radar-cross-probe.json
            /tmp/radar-proof-probe.json
          retention-days: 7

      - name: Detect creator opportunity collector changes
        id: opportunities_probe
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(config/creator-opportunity-sources\.json|scripts/collect_creator_opportunities\.py)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Read-only opportunity discovery diagnostics
        if: steps.opportunities_probe.outputs.run == 'true'
        run: python scripts/collect_creator_opportunities.py --report /tmp/opportunities-probe.json
      - name: Upload opportunity discovery diagnostics
        if: steps.opportunities_probe.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: opportunities-probe
          path: /tmp/opportunities-probe.json
          retention-days: 7
