name: Browser layout and interaction checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix /tmp/radar-browser --no-save --package-lock=false playwright@1.56.1
          /tmp/radar-browser/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Exercise the new primary-only ranking payload in the isolated browser checkout
        run: |
          python3 scripts/build_primary_ranking_projection.py
          wc -c site/data/unified-rankings.json
          python3 scripts/validate_model_links.py
      - name: Check actual browser layouts and interactions
        env:
          RADAR_BROWSER_DEPS: /tmp/radar-browser
          RADAR_SCREENSHOTS: /tmp/radar-screenshots
          RADAR_BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >/tmp/radar-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/test_browser_visual.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-browser-screenshots-${{ matrix.engine }}
          path: /tmp/radar-screenshots
          retention-days: 7
          if-no-files-found: warn
