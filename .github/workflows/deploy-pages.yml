name: Publish validated GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/validate_model_links.py'
      - 'scripts/audit_model_completeness.py'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/wait_pages_artifact.sh'
      - 'scripts/deploy_verified_pages.cjs'
      - 'scripts/publication_guard.py'
      - 'scripts/validate_snapshot.py'
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even when the online site tree matches"
        type: boolean
        default: true
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# One publish at a time, using the latest main after entering the queue.
# A GITHUB_TOKEN data commit does not trigger push workflows; the collector
# explicitly calls this reusable workflow after a validated successful commit.
concurrency:
  group: radar-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout committed main (never collect external data)
        uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate committed code and snapshots
        run: python scripts/validate_snapshot.py
      - name: Check whether this site tree is already published
        id: publication
        run: python scripts/publication_guard.py --output "$GITHUB_OUTPUT"
      - name: Record revision in the deployment artifact
        if: inputs.force || steps.publication.outputs.publication_status != 'current'
        run: |
          python scripts/publication_guard.py --write-marker
          echo "Publishing $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        if: inputs.force || steps.publication.outputs.publication_status != 'current'
        uses: actions/configure-pages@v6.0.0
      - name: Upload Pages artifact
        if: inputs.force || steps.publication.outputs.publication_status != 'current'
        id: pages_upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Verify Pages artifact visibility
        if: inputs.force || steps.publication.outputs.publication_status != 'current'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        run: bash scripts/wait_pages_artifact.sh
      - name: Deploy to GitHub Pages
        if: inputs.force || steps.publication.outputs.publication_status != 'current'
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_upload.outputs.artifact_id }}
        with:
          retries: 0
          script: |
            const deploy = require('./scripts/deploy_verified_pages.cjs')
            await deploy({github, context, core, artifactId: process.env.PAGES_ARTIFACT_ID})
      - name: Verify publicly served site revision after publication
        run: |
          if ! timeout 12s python scripts/publication_guard.py --verify-live --summary "$GITHUB_STEP_SUMMARY"; then
            echo "::warning::Live marker verification interrupted; publication remains unverified."
            printf '\\n### Post-publication live marker\\n- Status: unverified (verification process failed or timed out)\\n' >> "$GITHUB_STEP_SUMMARY"
          fi
