name: Monitor official AI model releases and deploy Pages

on:
  schedule:
    # Daily at 08:20 Asia/Shanghai (00:20 UTC). Scheduled workflows run on the default branch.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-creator-radar-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collectors
        run: python -m unittest discover -s tests -v

      - name: Collect official model updates
        run: python scripts/collect_models.py

      - name: Collect RSS and Awesome resources
        run: python scripts/collect_resources.py

      - name: Persist collected data to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/model-updates.json \
            site/data/model-monitor-status.json \
            site/data/model-monitor-state.json \
            site/data/feed-items.json \
            site/data/awesome-repos.json \
            site/data/resource-status.json \
            site/data/resource-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh model and resource intelligence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No collected data changes."
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
