name: Monitor official AI model releases and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 08:00 and 10:00 China Standard Time (UTC+8).
    # GitHub schedule events run on the default branch.
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-creator-radar-pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collectors
        run: python -m unittest discover -s tests -v

      - name: Collect official model updates
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_models.py

      - name: Build the 30-day release view from canonical model versions
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/build_model_release_digest.py

      - name: Update company chronologies from official model sources
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_chronicle_updates.py

      - name: Check official model resource links
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/check_model_resources.py

      - name: Collect RSS and Awesome resources
        if: github.event_name != 'schedule' || github.event.schedule == '0 2 * * *'
        run: python scripts/collect_resources.py

      - name: Collect public model leaderboard snapshot
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_rankings.py

      - name: Collect Maomu model ranking boards
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_maomu_rankings.py

      - name: Collect AIHOT selected items
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_aihot.py

      - name: Collect AIHOT daily digest
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_briefings.py aihot

      - name: Collect Juya daily digest
        if: github.event_name != 'schedule' || github.event.schedule == '0 2 * * *'
        run: python scripts/collect_briefings.py juya

      - name: Collect AIPick video ideas
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_aipick.py

      - name: Collect new model evaluation candidates
        if: github.event_name != 'schedule' || github.event.schedule == '0 0 * * *'
        run: python scripts/collect_model_evaluations.py

      - name: Link exact model mentions across radar data
        run: python scripts/link_model_records.py

      - name: Validate shared model references
        run: python scripts/validate_model_links.py

      - name: Persist collected data to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/data/models.json \
            site/data/model-updates.json \
            site/data/model-monitor-status.json \
            site/data/model-monitor-state.json \
            site/data-v3/models.json \
            site/data-v3/model-updates.json \
            site/data-v3/model-monitor-status.json \
            site/data-v3/model-monitor-state.json \
            site/data-v4/model-releases-30d.json \
            site/data-v3/topics.json \
            site/data-v3/chronicle-updates-status.json \
            site/data/reference-rankings.json \
            site/data-v3/reference-rankings.json \
            site/data-v4/aihot-items.json \
            site/data-v4/aihot-daily.json \
            site/data-v4/juya-daily.json \
            site/data-v4/maomu-rankings.json \
            site/data-v4/model-resource-status.json \
            site/data-v4/aipick-data.json \
            site/data-v4/model-evaluations.json \
            site/data-v4/social-accounts.json \
            site/data-v4/platforms.json \
            site/data/feed-items.json \
            site/data/awesome-repos.json \
            site/data/resource-status.json \
            site/data/resource-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh models, rankings and resources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No collected data changes."
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Publish the AI video creator workbench as the homepage
        if: github.ref == 'refs/heads/main'
        run: cp site/preview-v4.html site/index.html

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
