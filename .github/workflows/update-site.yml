name: Refresh radar data

on:
  push:
    branches: [main]
    # Run after collector/config changes, not after routine UI or docs pushes.
    paths:
      - 'scripts/collect_*.py'
      - 'scripts/build_*.py'
      - 'scripts/check_*.py'
      - 'scripts/link_model_records.py'
      - 'scripts/ranking_identity.py'
      - 'scripts/plan_refresh.py'
      - 'scripts/scheduler_manifest.py'
      - 'scripts/collection_health.py'
      - 'scripts/publication_guard.py'
      - 'scripts/persist_data.sh'
      - 'scripts/run_collection_batch.py'
      - 'scripts/validate_snapshot.py'
      - 'config/**'
      - '.github/workflows/update-site.yml'
  schedule:
    # Refresh cron to reactivate a possibly stalled GitHub schedule.
    # Two off-peak ticks check every group against persisted freshness.
    - cron: "5,35 * * * *"
    - cron: "15,25 0,2 * * *" # additional 08:15/25, 10:15/25 China time edition checks
  workflow_dispatch:
    inputs:
      scope:
        description: "Choose a production collection or deployment scope"
        type: choice
        required: true
        default: all
        options:
          - all
          - due
          - models
          - resources
          - aipick
          - maintenance
          - deploy-only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-data-refresh
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.scope == 'deploy-only')
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
      critical_incident: ${{ steps.health.outputs.critical_incident }}
      publication_status: ${{ steps.publication.outputs.publication_status }}
    timeout-minutes: 45
    steps:
      - name: Checkout the triggering ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node for rendering tests
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Plan due collection scopes
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SCOPE: ${{ inputs.scope || '' }}
          SCHEDULE: ${{ github.event.schedule || '' }}
        run: python scripts/plan_refresh.py --event "$EVENT_NAME" --scope "$MANUAL_SCOPE" --schedule "$SCHEDULE" --output "$GITHUB_OUTPUT"

      - name: Collect AIHOT daily digest
        id: aihot_daily
        continue-on-error: true
        timeout-minutes: 3
        if: steps.plan.outputs.aihot_daily == 'true'
        run: python scripts/collect_briefings.py aihot

      - name: Collect Juya daily digest
        id: juya_daily
        continue-on-error: true
        timeout-minutes: 5
        if: steps.plan.outputs.juya_daily == 'true'
        run: python scripts/collect_briefings.py juya

      - name: Collect AIHOT selected items
        id: aihot
        continue-on-error: true
        timeout-minutes: 2
        if: steps.plan.outputs.selected == 'true'
        run: |
          if ! python scripts/collect_aihot.py; then
            echo "::warning::AIHOT selected fetch failed; retrying once in 10 seconds."
            sleep 10
            python scripts/collect_aihot.py
          fi

      - name: Collect AIPick selected items and hot topics independently
        id: aipick
        continue-on-error: true
        timeout-minutes: 2
        if: steps.plan.outputs.aipick == 'true'
        run: python scripts/collect_aipick.py

      - name: Collect model updates and derived views transactionally
        id: models_batch
        continue-on-error: true
        if: steps.plan.outputs.models == 'true'
        run: python scripts/run_collection_batch.py models

      - name: Recover model leads from freshly collected briefings
        id: recovery_batch
        continue-on-error: true
        if: steps.plan.outputs.models != 'true' && (steps.aihot.outcome == 'success' || steps.aihot_daily.outcome == 'success' || steps.juya_daily.outcome == 'success')
        run: python scripts/run_collection_batch.py recovery

      - name: Collect resources and rankings in isolated transactions
        id: resources_batch
        continue-on-error: true
        if: steps.plan.outputs.resources == 'true'
        run: python scripts/run_collection_batch.py resources

      - name: Collect maintenance sources in isolated transactions
        id: maintenance_batch
        continue-on-error: true
        if: steps.plan.outputs.maintenance == 'true'
        run: python scripts/run_collection_batch.py maintenance

      - name: Block persistence after a fatal transaction or rollback error
        if: always() && !cancelled()
        run: test ! -e .radar-collection-fatal

      - name: Validate creator opportunity records
        run: |
          python scripts/check_creator_links.py --dry-run
          python scripts/collect_creator_opportunities.py --dry-run

      - name: Link exact model mentions across radar data
        if: steps.plan.outputs.collect == 'true'
        run: python scripts/link_model_records.py

      - name: Record briefing source health and deduplicate alerts
        id: health
        if: steps.plan.outputs.collect == 'true'
        env:
          AIHOT_SELECTED: ${{ steps.aihot.outcome }}
          AIPICK_SELECTED: ${{ steps.aipick.outcome }}
          AIHOT_DAILY: ${{ steps.aihot_daily.outcome }}
          JUYA_DAILY: ${{ steps.juya_daily.outcome }}
          MODEL_BATCH: ${{ steps.models_batch.outcome }}
          RECOVERY_BATCH: ${{ steps.recovery_batch.outcome }}
          RESOURCES_BATCH: ${{ steps.resources_batch.outcome }}
          MAINTENANCE_BATCH: ${{ steps.maintenance_batch.outcome }}
          RADAR_RUN_ID: ${{ github.run_id }}
          RADAR_EVENT: ${{ github.event_name }}
          RADAR_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python scripts/collection_health.py --critical-output --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Reconcile platform coverage with final upstream snapshots
        if: steps.plan.outputs.collect == 'true'
        run: python scripts/collect_app_updates.py --coverage-only

      - name: Reconcile derived release digest after all upstream writes
        if: steps.plan.outputs.collect == 'true'
        run: python scripts/preflight.py --digest-only --repair-digest

      - name: Validate regenerated snapshot in isolated parallel lanes
        run: python scripts/validate_snapshot.py

      - name: Publish cross-module integrity audit
        if: steps.plan.outputs.collect == 'true'
        run: python scripts/audit_radar_system.py --write

      - name: Record validated collection heartbeat and next due time
        if: steps.plan.outputs.collect == 'true'
        env:
          RADAR_EVENT: ${{ github.event_name }}
          RADAR_SCHEDULE: ${{ github.event.schedule || '' }}
          RADAR_RUN_ID: ${{ github.run_id }}
          RADAR_RUN_ATTEMPT: ${{ github.run_attempt }}
          RADAR_SCOPE: ${{ inputs.scope || '' }}
          RADAR_DEFERRED_SLOW_GROUPS: ${{ steps.plan.outputs.deferred_slow_groups }}
        run: python scripts/scheduler_manifest.py

      - name: Persist collected data to the triggering branch
        id: persist
        if: steps.plan.outputs.collect == 'true'
        run: bash scripts/persist_data.sh

      - name: Detect unpublished committed site on no-change runs
        id: publication
        if: steps.persist.outputs.changed != 'true'
        run: python scripts/publication_guard.py --output "$GITHUB_OUTPUT"

  publish:
    needs: collect
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.scope == 'deploy-only') || (needs.collect.result == 'success' && (needs.collect.outputs.changed == 'true' || needs.collect.outputs.publication_status == 'stale')))
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'deploy-only' }}

  report-integrity-incident:
    needs: [collect, publish]
    if: always() && !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.changed == 'true' && needs.collect.outputs.critical_incident == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report newly persistent collection incident
        run: |
          echo "::error::A collection batch failed three consecutive attempts. Valid snapshots and the incident record were retained; see collection-health.json and collector logs."
          exit 1
