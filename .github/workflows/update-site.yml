name: Monitor official AI model releases and deploy Pages

on:
  schedule:
    # Daily at 08:20 Asia/Shanghai (00:20 UTC)
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-creator-radar-pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collectors
        run: python -m unittest discover -s tests -v

      - name: Collect official model updates
        run: python scripts/collect_models.py

      - name: Collect RSS and Awesome resources
        run: python scripts/collect_resources.py

      - name: Persist collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/model-updates.json site/data/model-monitor-status.json site/data/model-monitor-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh official model updates"
            git push
          else
            echo "No model update changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
