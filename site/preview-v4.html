<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作情报台 · V4 本地预览</title>
<meta name="description" content="AI 模型动态、专业排行榜、今日早报、主题与创作导航。">
<style>
:root{--bg:#f5f7f9;--paper:#fff;--paper2:#f8fafb;--ink:#202a34;--muted:#72808d;--muted2:#9aa5af;--line:#e5eaee;--blue:#2676df;--blue2:#edf5ff;--blueLine:#d7e7fb;--green:#21866b;--amber:#a56b21;--shadow:0 5px 20px rgba(30,50,70,.045);--radius:15px;--side:244px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 24px}

.brand-name{font-weight:760;font-size:16px;letter-spacing:-.3px}
.brand-sub{font-size:9px;letter-spacing:1.1px;color:var(--muted2);font-weight:750}
.nav-scroll{overflow:auto;flex:1;padding:0 0 14px}
.nav-group{margin:0 0 21px}
.nav-label{padding:0 10px 8px;color:#9aa5af;font-size:10px;font-weight:750;letter-spacing:.8px}
.nav{display:grid;gap:3px}
.nav button{width:100%;border:0;background:transparent;color:#53616e;text-align:left;border-radius:10px;padding:10px 11px;display:flex;align-items:center;gap:11px;font-size:13px;transition:background .16s,color .16s}
.nav button:hover{background:#f5f8fb;color:var(--ink)}

.nav-icon{width:19px;height:19px;display:grid;place-items:center;flex:none}
.nav-icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{border-top:1px solid var(--line);padding:12px 9px 0;color:var(--muted2);font-size:10px;line-height:1.7}
.main{margin-left:var(--side);min-height:100vh}
.topbar{height:64px;position:sticky;top:0;z-index:10;background:rgba(245,247,249,.91);backdrop-filter:blur(14px);border-bottom:1px solid rgba(225,231,236,.8);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:18px}
.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:700}
.preview-label{margin-left:9px;border:1px solid var(--blueLine);background:var(--blue2);color:var(--blue);font-size:9px;padding:3px 7px;border-radius:99px;font-weight:750}
.top-right{display:flex;align-items:center;gap:10px}
.search{width:min(340px,38vw);height:36px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:0 13px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--ink)}
.content{max-width:1480px;margin:0 auto;padding:30px 34px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:0 0 22px}
.eyebrow{font-size:9px;letter-spacing:1.5px;color:#3b8492;font-weight:800;text-transform:uppercase;margin-bottom:7px}
.page-title{font-size:27px;letter-spacing:-.8px;line-height:1.2;margin:0;font-weight:780}
.page-desc{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.7}
.head-meta{font-size:10px;color:var(--muted2);white-space:nowrap}
.hero{border:1px solid var(--line);border-radius:19px;background:linear-gradient(112deg,#fff 0%,#f8fbff 65%,#eff6ff 100%);padding:27px 30px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;border:1px solid rgba(56,126,210,.1);right:6%;top:-95px;box-shadow:0 0 0 32px rgba(56,126,210,.025),0 0 0 68px rgba(56,126,210,.02)}
.hero-kicker{font-size:9px;color:#3b8492;font-weight:800;letter-spacing:1.4px}
.hero h1{font-size:27px;line-height:1.35;letter-spacing:-.8px;margin:9px 0 7px;position:relative;z-index:1}
.hero p{font-size:12px;color:var(--muted);max-width:740px;line-height:1.8;margin:0;position:relative;z-index:1}
.hero-bottom{display:flex;gap:18px;flex-wrap:wrap;margin-top:17px;color:var(--muted);font-size:10px;position:relative;z-index:1}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#31a27c;margin-right:5px;vertical-align:1px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:27px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--shadow)}
.stat-label{font-size:10px;color:var(--muted)}

.stat-note{font-size:9px;color:var(--muted2);margin-top:2px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 12px}

.tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.tab{border:1px solid var(--line);background:#fff;color:#65727e;border-radius:99px;padding:7px 13px;font-size:11px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}

.timeline{position:relative;margin:5px 0 0 8px;padding-left:26px}
.timeline:before{content:"";position:absolute;left:7px;top:7px;bottom:8px;width:1px;background:#dce5ec}
.month-group{margin:0 0 25px}
.month-title{font-size:14px;font-weight:780;margin:0 0 11px;letter-spacing:-.2px}

.timeline-date{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.timeline-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}
.timeline-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);background:#f8fafb;color:#64717d;border-radius:99px;padding:3px 7px;font-size:9px;line-height:1.3}
.pill.blue{border-color:var(--blueLine);background:var(--blue2);color:var(--blue)}
.pill.green{border-color:#d4eee4;background:#f0faf6;color:var(--green)}
.timeline-card h3{font-size:13px;margin:0 0 5px;line-height:1.5}
.timeline-card p{font-size:11px;line-height:1.7;color:var(--muted);margin:0}
.timeline-card a{display:inline-block;margin-top:8px;color:var(--blue);text-decoration:none;font-size:10px;font-weight:700}
.model-grid,.platform-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.model-card,.platform-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;box-shadow:var(--shadow);min-width:0}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-box{width:34px;height:34px;flex:none;border:1px solid var(--line);border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.brand-box img{width:22px;height:22px;object-fit:contain}
.brand-fallback{display:none;width:100%;height:100%;place-items:center;color:#59718a;font-size:10px;font-weight:800;background:#f1f6fb}
.card-title{font-size:12px;font-weight:750;line-height:1.4}
.card-sub{font-size:10px;color:var(--muted);margin-top:3px}
.card-note{font-size:10px;line-height:1.65;color:var(--muted);margin:12px 0 13px;min-height:34px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #eef1f3;padding-top:10px}
.text-link{color:var(--blue);text-decoration:none;font-size:10px;font-weight:720}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.filter-label{font-size:10px;color:var(--muted);font-weight:700}
.filter-chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:99px;padding:6px 10px;font-size:10px}
.filter-chip.active{background:var(--blue2);border-color:var(--blueLine);color:var(--blue);font-weight:700}
.rank-intro{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.rank-intro p{font-size:11px;line-height:1.65;color:var(--muted);margin:0}
.rank-intro button{white-space:nowrap;border:1px solid var(--blueLine);background:var(--blue2);color:var(--blue);border-radius:99px;padding:8px 12px;font-size:10px;font-weight:750}
.rank-source-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.rank-source{display:flex;align-items:flex-start;gap:9px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:12px}
.rank-source strong{display:block;font-size:10px}
.rank-source p{font-size:9px;color:var(--muted);line-height:1.55;margin:4px 0 0}
.rank-board{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.rank-board-head{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.rank-board-title{display:flex;align-items:center;gap:10px;min-width:0}
.rank-board-title h2{font-size:14px;margin:0}

.rank-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.rank-actions button,.rank-actions a{border:1px solid var(--line);background:#fff;color:#596774;border-radius:8px;padding:7px 10px;font-size:10px;text-decoration:none}
.rank-actions button.primary{border-color:var(--blueLine);background:var(--blue2);color:var(--blue);font-weight:700}
.rank-method{padding:10px 17px;background:#fbfcfd;color:var(--muted);font-size:10px;line-height:1.6;border-bottom:1px solid var(--line)}
.embed-wrap{padding:0;background:#fff}
.embed-wrap iframe{display:block;width:100%;height:740px;border:0;background:#fff}
.embed-placeholder{padding:30px;text-align:center;color:var(--muted);font-size:11px}
.rank-snapshot{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:var(--shadow);margin:0 0 18px}
.rank-snapshot-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rank-snapshot-head h2{font-size:14px;margin:0}.rank-snapshot-head p{font-size:10px;color:var(--muted);margin:4px 0 0;line-height:1.55}
.rank-snapshot-actions{display:flex;gap:7px;flex-wrap:wrap}.rank-snapshot-actions a{border:1px solid var(--blueLine);background:var(--blue2);color:var(--blue);border-radius:8px;padding:7px 10px;font-size:10px;text-decoration:none;white-space:nowrap}
.rank-table-wrap{overflow:auto}.rank-table{width:100%;min-width:850px;border-collapse:collapse;font-size:10px}.rank-table th,.rank-table td{padding:9px 11px;border-bottom:1px solid #edf0f2;text-align:left;white-space:nowrap}.rank-table th{background:#f7f9fa;color:#6b7883;font-weight:700}.rank-table td:first-child,.rank-table th:first-child{text-align:center;width:48px}.rank-table tr:last-child td{border-bottom:0}.rank-model{font-weight:720;color:#26323b}.rank-ci,.rank-muted{color:var(--muted)}.rank-pagination{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.rank-pagination button{border:1px solid var(--line);background:#fff;color:#52616e;border-radius:7px;padding:6px 9px;font-size:10px}.rank-pagination button:disabled{opacity:.45;cursor:default}
.notice{padding:12px 14px;border:1px solid var(--blueLine);border-radius:12px;background:#f5f9ff;color:#526b84;font-size:10px;line-height:1.7;margin:0 0 15px}
.news-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.news-toolbar span{font-size:10px;color:var(--muted)}
.news-toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:10px;color:#53616e}
.news-list{display:grid;gap:9px}
.aihot-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 13px}
.aihot-toolbar .tabs{margin:0}

.aihot-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
.aihot-card h3{font-size:13px;line-height:1.55;margin:7px 0}

.aihot-card-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}

.news-card{border:1px solid var(--line);background:#fff;border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.news-card summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px}
.news-card summary::-webkit-details-marker{display:none}
.news-index{width:26px;height:26px;border-radius:8px;background:#f0f5fa;color:#5c7894;display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
.news-summary{min-width:0;flex:1}

.news-links{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:760px){.rank-snapshot-head{align-items:flex-start;flex-direction:column}}

<script>
const DATA='./data-v3/';
const SOCIAL_DATA='./data-v4/';
const ICONS={
 spark:'<path d="m12 2 1.7 6.3L20 10l-6.3 1.7L12 18l-1.7-6.3L4 10l6.3-1.7z"/><path d="m19 14 .8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"/>',
 layers:'<path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',
 chart:'<path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 6-7"/>',
 book:'<path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 0 5 22z"/><path d="M5 4.5V22M9 7h7M9 11h7"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 wand:'<path d="m15 4 5 5M4 20 17 7M6 4v3M4.5 5.5h3M19 15v4M17 17h4"/>',
 video:'<rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
 code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 4l-4 16"/>',
 terminal:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>',
 brain:'<path d="M9 4a3 3 0 0 0-5 2 3.5 3.5 0 0 0 0 6 3.5 3.5 0 0 0 2 6 3 3 0 0 0 5 2V4z"/><path d="M15 4a3 3 0 0 1 5 2 3.5 3.5 0 0 1 0 6 3.5 3.5 0 0 1-2 6 3 3 0 0 1-5 2V4z"/><path d="M9 8h2M13 8h2M8 14h3M13 14h3"/>',
 type:'<path d="M4 5h16M12 5v14M8 19h8"/>',
 megaphone:'<path d="m3 11 18-5v12L3 13z"/><path d="M11 14.5 13 21h-3l-2-7"/><path d="M21 9v6"/>'
};
function icon(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||ICONS.spark)+'</svg>'}
document.querySelectorAll('[data-icon]').forEach(function(x){x.innerHTML=icon(x.dataset.icon)});
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safeUrl(v){try{var u=new URL(v);return u.protocol==='https:'?u.href:'#'}catch(e){return '#'}}
function hostOf(v){try{return new URL(v).hostname.replace(/^www\./,'')}catch(e){return ''}}
function favicon(v){var h=hostOf(v);return h?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64':''}
function initials(v){return String(v||'?').replace(/[^A-Za-z0-9\u4e00-\u9fa5]/g,'').slice(0,2)||'?'}
function brandBox(name,url){var src=favicon(url);return '<span class="brand-box">'+(src?'<img src="'+src+'" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'">':'')+'<span class="brand-fallback" style="display:'+(src?'none':'grid')+'">'+esc(initials(name))+'</span></span>'}
function date(v){if(!v)return '日期待确认';var d=new Date(v);if(isNaN(d))return '日期待确认';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function shortDate(v){if(!v)return '';var d=new Date(v);if(isNaN(d))return '';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit'}).format(d)}
function monthLabel(v){var d=new Date(v);return isNaN(d)?'日期待确认':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long'}).format(d)}
function categoryName(v){return {video:'视频',image:'图像',llm:'大语言模型',music:'音乐 / 语音'}[v]||'其他'}
function matches(v){var q=state.query.trim().toLowerCase();return !q||String(v||'').toLowerCase().indexOf(q)>=0}
function pageHead(title,desc,meta){return '<div class="page-head"><div><div class="eyebrow">AI CREATOR RADAR</div><h1 class="page-title">'+title+'</h1><p class="page-desc">'+desc+'</p></div><div class="head-meta">'+(meta||'')+'</div></div>'}
function empty(t){return '<div class="empty">'+esc(t)+'</div>'}
var state={view:'today',query:'',models:[],updates:[],platforms:[],rankings:{categories:[]},referenceRankings:{boards:[]},rankSources:[],topics:[],news:{items:[]},aihot:{items:[],status:'idle',updatedAt:'',error:'',etag:''},aihotCategory:'all',aipick:{items:[],hotTopics:[],status:'idle',itemsEtag:'',hotEtag:'',updatedAt:'',error:''},aipickCategory:'all',social:{brands:[],posts:[]},timelineCategory:'all',modelCategory:'video',regionFilter:'all',accessFilter:'all',rankTab:'video',rankSub:'video-text-audio',rankPage:0,rankExpanded:true,rankSourcesOpen:false,newsExpanded:false,platformCategory:'video',socialPlatform:'all',activeTopic:null};
var content=document.getElementById('content');
var labels={today:'模型动态',models:'模型库',rankings:'模型排行榜',feeds:'AI 早报',aihot:'AIHOT 精选',aipick:'视频选题',topics:'主题',social:'社媒监控',platforms:'创作导航'};
async function loadData(){
 var names=['models.json','model-updates.json','rankings.json','ranking-sources.json','topics.json','news-today.json','reference-rankings.json'];
 var vals=await Promise.all(names.map(function(n){return fetch(DATA+n+'?v=3').then(function(r){if(!r.ok)throw new Error(n);return r.json()})}));
 state.models=vals[0]||[];
 state.updates=(vals[1]&&vals[1].items)||[];
 state.rankings=vals[2]||{categories:[]};
 state.rankSources=vals[3]||[];
 state.topics=vals[4]||[];
 state.news=vals[5]||{items:[]};
 state.referenceRankings=vals[6]||{boards:[]};
 var socialResponse=await fetch(SOCIAL_DATA+'social-accounts.json?v=4');
 if(!socialResponse.ok)throw new Error('social-accounts.json');
 state.social=await socialResponse.json();
 var platformResponse=await fetch(SOCIAL_DATA+'platforms.json?v=4');
 if(!platformResponse.ok)throw new Error('platforms.json');
 state.platforms=await platformResponse.json();
 render();
}
function setView(v){state.view=v;state.activeTopic=null;document.querySelectorAll('#sidebar [data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)});document.getElementById('crumbTitle').textContent=labels[v]||'模型动态';document.getElementById('sidebar').classList.remove('open');render();if(v==='aihot'&&state.aihot.status==='idle')loadAiHot();if(v==='aipick'&&state.aipick.status==='idle')loadAiPick()}
function render(){
 document.querySelectorAll('#sidebar [data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===state.view)});
 document.getElementById('crumbTitle').textContent=labels[state.view]||'模型动态';
 if(state.view==='today')content.innerHTML=timelinePage();
 else if(state.view==='models')content.innerHTML=modelPage();
 else if(state.view==='rankings')content.innerHTML=rankingsPage();
 else if(state.view==='feeds')content.innerHTML=feedsPage();
 else if(state.view==='aihot')content.innerHTML=aihotPage();
 else if(state.view==='aipick')content.innerHTML=aiPickPage();
 else if(state.view==='topics')content.innerHTML=topicsPage();
 else if(state.view==='social')content.innerHTML=socialPage();
 else if(state.view==='platforms')content.innerHTML=platformsPage();
 else content.innerHTML=timelinePage();
}
function timelinePage(){
 var all=state.updates.slice().filter(function(x){return state.timelineCategory==='all'||x.category===state.timelineCategory}).filter(function(x){return matches([x.title,x.modelName,x.vendor,x.summary].join(' '))}).sort(function(a,b){return String(b.publishedAt||'').localeCompare(String(a.publishedAt||''))});
 var groups={};all.forEach(function(x){var k=String(x.publishedAt||'').slice(0,7)||'unknown';(groups[k]||(groups[k]=[])).push(x)});
 var keys=Object.keys(groups).sort().reverse();
 var tabs=[['all','全部'],['video','视频'],['image','图像'],['music','音乐 / 语音'],['llm','大语言模型']];
 var tabHtml=tabs.map(function(t){return '<button class="tab '+(state.timelineCategory===t[0]?'active':'')+'" data-timeline-cat="'+t[0]+'">'+(t[0]==='all'?'◷ ':'')+t[1]+'</button>'}).join('');
 var timeline=keys.map(function(k){return '<section class="month-group"><h2 class="month-title">'+(k==='unknown'?'日期待确认':k.slice(0,4)+'年'+k.slice(5,7)+'月')+'</h2><div class="timeline">'+groups[k].map(function(x){var m=state.models.find(function(y){return y.id===x.modelId||y.name===x.modelName});var logo=(m&&m.homepage)||x.url;var kind=x.updateType==='api-update'?'API 更新':x.updateType==='model-card'?'模型卡更新':x.updateType==='api-update'?'API 更新':'模型发布';return '<div class="timeline-item"><div class="timeline-date">'+shortDate(x.publishedAt)+'</div><article class="timeline-card"><div class="timeline-meta"><span class="pill blue">'+categoryName(x.category)+'</span><span class="pill">'+kind+'</span><span style="font-size:9px;color:var(--muted)">'+esc(x.vendor||'官方')+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||'官方更新，打开原文查看详情。')+'</p><a href="'+safeUrl(x.url)+'" target="_blank" rel="noopener noreferrer">官方原文 ↗</a></article></div>'}).join('')+'</div></section>'}).join('');
 return '<section class="hero"><div class="hero-kicker">MODEL RELEASE TIMELINE</div><h1>模型发布，不只看今天。<br>按月份回看每一次重要更新。</h1><p>把图像、视频、音乐与语音、大语言模型的版本变化放在同一条时间线上。每条记录保留发布日期、更新类型和官方原文。</p><div class="hero-bottom"><span><i class="dot"></i> '+all.length+' 条已收录动态</span><span>◷ '+keys.length+' 个月份</span><span>信源优先：厂商官网与官方更新日志</span></div></section>'+pageHead('模型时间线','选择模型类别，按月份查看正式发布、模型卡与 API 更新。','按发布日期排序')+'<div class="tabs">'+tabHtml+'</div>'+(timeline||empty('这个分类暂时没有已收录的官方动态。'))+'<div class="footer"><span>模型发布与 API 更新分开标记；未核验日期不进入时间线</span><span>本地预览数据 · 后续接入每日自动更新</span></div>'
}
function modelCard(m){
 var detail=m.modelCardUrl||m.releaseUrl;
 return '<article class="model-card"><div class="card-top"><div class="card-brand">'+brandBox(m.vendor||m.name,m.homepage)+'<div><div class="card-title">'+esc(m.name)+'</div><div class="card-sub">'+esc(m.vendor||'')+' · '+categoryName(m.category)+(m.version?' · '+esc(m.version):'')+'</div></div></div></div><div class="filter-row" style="margin:12px 0 0"><span class="pill">'+esc(m.region||'地区待确认')+'</span><span class="pill '+(m.access==='开源权重'?'green':'')+'">'+esc(m.access||'许可待确认')+'</span><span class="pill">'+(m.watched===false?'候选观察':'关注中')+'</span></div><p class="card-note">'+esc(m.note||'关注官方模型发布与版本更新。')+'</p>'+(m.accessNote?'<p class="card-note" style="color:var(--muted)">'+esc(m.accessNote)+'</p>':'')+'<div class="card-foot"><div style="display:flex;gap:8px"><a class="text-link" href="'+safeUrl(m.homepage)+'" target="_blank" rel="noopener noreferrer">官方体验 ↗</a>'+(detail?'<a class="text-link" href="'+safeUrl(detail)+'" target="_blank" rel="noopener noreferrer">模型资料 ↗</a>':'')+'</div><span style="font-size:9px;color:var(--muted2)">官方来源</span></div></article>'
}
function modelPage(){
 var cats=[['video','视频'],['image','图像'],['music','音乐 / 语音'],['llm','大语言模型']];
 if(cats.every(function(t){return t[0]!==state.modelCategory}))state.modelCategory='video';
 var items=state.models.filter(function(m){return m.category===state.modelCategory&&(state.regionFilter==='all'||m.region===state.regionFilter)&&(state.accessFilter==='all'||m.access===state.accessFilter)&&matches([m.name,m.vendor,m.note,m.version].join(' '))});
 var tabs=cats.map(function(t){return '<button class="tab '+(state.modelCategory===t[0]?'active':'')+'" data-model-cat="'+t[0]+'">'+t[1]+'</button>'}).join('');
 var regions=['all','中国','海外'].map(function(x){return '<button class="filter-chip '+(state.regionFilter===x?'active':'')+'" data-region="'+x+'">'+(x==='all'?'全部地区':x)+'</button>'}).join('');
 var access=['all','开源权重','闭源'].map(function(x){return '<button class="filter-chip '+(state.accessFilter===x?'active':'')+'" data-access="'+x+'">'+(x==='all'?'全部许可':x)+'</button>'}).join('');
 return pageHead('模型库','按模态、地区与权重开放程度管理你关注的模型。',''+state.models.length+' 个模型')+'<div class="tabs">'+tabs+'</div><div class="filter-row"><span class="filter-label">地区</span>'+regions+'<span class="filter-label" style="margin-left:8px">权重</span>'+access+'</div><div class="section-head"><div><h2>模型清单</h2><p>官方体验入口与版本信息</p></div><span class="head-meta">'+items.length+' 个匹配模型</span></div><div class="model-grid">'+(items.length?items.map(modelCard).join(''):empty('没有匹配的模型。'))+'</div>'
}
function rankCategory(){return (state.rankings.categories||[]).find(function(x){return x.id===state.rankTab})||state.rankings.categories[0]}
function rankSnapshotTime(v){if(!v)return '时间待确认';var d=new Date(v);return isNaN(d)?esc(v):new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}
function rankSnapshotBoard(){return (state.referenceRankings.boards||[]).filter(function(x){return x.kind===state.rankTab})}
function rankSnapshotTable(board){

async function aipickRequest(url,etag,fallback){
 var headers={Accept:'application/json'};if(etag)headers['If-None-Match']=etag;
 var response=await fetch(url,{headers:headers,credentials:'omit',cache:'no-store'});

}

  var news=(state.news.items||[]).filter(function(x){var s=[x.title,x.summary,x.detail].join(' ');return keys.some(function(k){return s.toLowerCase().indexOf(k.toLowerCase())>=0})});
  var updateHtml=updates.map(function(x){return '<article class="timeline-card" style="margin-bottom:9px"><div class="timeline-meta"><span class="pill blue">'+categoryName(x.category)+'</span><span class="pill">'+date(x.publishedAt)+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p><a href="'+safeUrl(x.url)+'" target="_blank" rel="noopener noreferrer">原始来源 ↗</a></article>'}).join('');
  var newsHtml=news.map(function(x){return '<article class="timeline-card" style="margin-bottom:9px"><div class="timeline-meta"><span class="pill">'+esc(x.category)+'</span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary)+'</p>'+(x.links||[]).map(function(l){return '<a href="'+safeUrl(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label)+' ↗</a> '}).join('')+'</article>'}).join('');
  return pageHead('主题详情','按主题聚合本地已收录动态，同时保留外部主题信源。',t.group)+'<section class="topic-detail">'+brandBox(t.name,t.domain?'https://'+t.domain:'https://aihot.news/topics')+'<h2 style="margin-top:12px">'+esc(t.name)+'</h2><p>'+esc(t.description)+'</p><div class="topic-detail-actions"><button data-topic-back>← 返回主题</button><a href="'+safeUrl(t.topicUrl||'https://aihot.news/topics')+'" target="_blank" rel="noopener noreferrer">查看 AI HOT 主题原页 ↗</a></div><div class="section-head"><div><h2>模型动态</h2><p>'+updates.length+' 条匹配记录</p></div></div>'+(updateHtml||empty('本地时间线暂时没有该主题的模型更新。'))+'<div class="section-head"><div><h2>今日早报</h2><p>'+news.length+' 条匹配记录</p></div></div>'+(newsHtml||empty('今日早报中暂时没有匹配内容。'))+'</section>'
 }
 var groups=['公司与模型','技术方向','内容类型'];
 return pageHead('按主题看 AI','按厂商、技术方向和内容类型浏览，快速找到你关心的模型与创作领域。',''+state.topics.length+' 个主题')+groups.map(function(g){var list=state.topics.filter(function(t){return t.group===g&&matches([t.name,t.description].join(' '))});return '<section class="topic-section"><div class="topic-section-head"><h2>'+g+'</h2><p>'+(g==='公司与模型'?'按厂商追踪模型、产品与公司动态':g==='技术方向'?'按技术领域深挖：Agent、多模态、具身智能等':'按体裁浏览：论文、教程、评测、观点与趋势')+'</p></div><div class="topic-grid">'+list.map(topicCard).join('')+'</div></section>'}).join('')+'<div class="footer"><span>主题分类参考 AI HOT 的公司与模型、技术方向、内容类型三组结构</span><a class="text-link" href="https://aihot.news/topics" target="_blank" rel="noopener noreferrer">查看 AI HOT 主题体系 ↗</a></div>'
}
function platformCard(p){
 return '<article class="platform-card"><div class="card-top"><div class="card-brand">'+brandBox(p.name,p.url)+'<div><div class="card-title">'+esc(p.name)+'</div><div class="card-sub">'+esc(p.type||'AI 创作工具')+'</div></div></div><span class="platform-status '+(p.status==='常用'?'common':'')+'">'+esc(p.status||'候选')+'</span></div><p class="card-note">'+esc(p.note||'创作工具入口。')+'</p><div class="card-foot"><a class="text-link" href="'+safeUrl(p.url)+'" target="_blank" rel="noopener noreferrer">打开官网 ↗</a><span style="font-size:9px;color:var(--muted2)">官方站点图标</span></div></article>'
}
function platformsPage(){
 var cats=[['video','视频','video'],['image','图像','image'],['music','音乐','music'],['text','文字','type'],['aggregate','聚合平台','layers'],['social','社交媒体','megaphone']];
 var items=state.platforms.filter(function(p){return (p.categories||[]).indexOf(state.platformCategory)>=0&&matches([p.name,p.type,p.note].join(' '))});
 var tabs=cats.map(function(x){return '<button class="platform-tab '+(state.platformCategory===x[0]?'active':'')+'" data-platform-cat="'+x[0]+'">'+icon(x[2])+x[1]+'</button>'}).join('');
 var description={video:'视频生成、视频编辑与影视创作平台。',image:'图像生成、图像编辑与视觉设计工具。',music:'音乐生成、歌曲创作与音频工具。',text:'文本、研究、代码与通用 AI 助手。',aggregate:'多模型聚合平台、画布工具与创作工作流。',social:'国内外社交媒体、创作者社区与 AI 行业讨论入口。'};
 return pageHead('创作导航','按实际创作任务找工具。聚合平台与单一模型工具分开归类，不设置无意义的「全部」。',''+state.platforms.length+' 个入口')+'<div class="notice"><strong>'+cats.find(function(x){return x[0]===state.platformCategory})[1]+'：</strong>'+description[state.platformCategory]+' 所有品牌图标从对应官网 Favicon 获取；图标缺失时才使用文字缩写。</div><div class="platform-tabs">'+tabs+'</div><div class="section-head"><div><h2>'+cats.find(function(x){return x[0]===state.platformCategory})[1]+'工具</h2><p>'+description[state.platformCategory]+'</p></div><span class="head-meta">'+items.length+' 个网站</span></div><div class="platform-grid">'+(items.length?items.map(platformCard).join(''):empty('这个分类暂时没有收录工具。'))+'</div>'
}

function socialPage(){
 var brands=state.social.brands||[];
 var posts=(state.social.posts||[]).filter(function(p){return matches([p.brand,p.platform,p.title,p.type,p.note].join(' '))&&(state.socialPlatform==='all'||p.platform===state.socialPlatform)}).slice().sort(function(a,b){return String(b.sortKey||'').localeCompare(String(a.sortKey||''))});
 var allAccounts=[];brands.forEach(function(b){(b.accounts||[]).forEach(function(a){allAccounts.push(a)})});
 var verified=allAccounts.filter(function(a){return a.status==='verified'||a.status==='verified-search'}).length;
 var snapshots=allAccounts.filter(function(a){return a.followers!==null&&a.followers!==undefined}).length;
 var platformNames=['全部','抖音','B站','小红书','X','微博','Instagram','TikTok','YouTube','LinkedIn'];
 var platformIds=['all','抖音','B站','小红书','X','微博','Instagram','TikTok','YouTube','LinkedIn'];
 var tabs=platformNames.map(function(n,i){return '<button class="tab '+(state.socialPlatform===platformIds[i]?'active':'')+'" data-social-platform="'+platformIds[i]+'">'+n+'</button>'}).join('');
 var filteredBrands=brands.map(function(b){
  var accounts=(b.accounts||[]).filter(function(a){return (state.socialPlatform==='all'||a.platform===state.socialPlatform)&&matches([b.name,b.company,b.note,a.platform,a.handle,a.verification].join(' '))});
  return {brand:b,accounts:accounts};
 }).filter(function(x){return x.accounts.length>0&&matches([x.brand.name,x.brand.company,x.brand.note].join(' '))});
 var brandCards=filteredBrands.map(function(x){
  var b=x.brand;
  var accountCards=x.accounts.map(function(a){
   var review=a.status==='review';
   var statusLabel=review?'待复核':a.status==='verified-search'?'官方搜索入口':'已核验';
   var metric=a.followersDisplay||'未读取';
   var accountLabel=a.status==='verified-search'?'打开官方搜索入口':'打开账号主页';
   return '<article class="social-account-card"><div class="social-account-head"><span class="social-account-name">'+esc(a.platform)+' · '+esc(a.handle)+'</span><span class="social-account-status '+(review?'review':'')+'">'+statusLabel+'</span></div><div class="social-account-metric">'+esc(metric)+'</div><div class="social-account-note">'+esc(a.snapshotLabel||a.verification||'粉丝数待采集')+'</div>'+(a.extraMetric?'<div class="social-account-note">'+esc(a.extraMetric)+'</div>':'')+'<div class="social-account-source"><a href="'+safeUrl(a.url)+'" target="_blank" rel="noopener noreferrer">'+accountLabel+' ↗</a>'+(a.sourceUrl?'<a href="'+safeUrl(a.sourceUrl)+'" target="_blank" rel="noopener noreferrer">核验来源 ↗</a>':'')+'</div></article>'
  }).join('');
  return '<article class="social-brand-card"><div class="social-brand-head">'+brandBox(b.name,b.officialSite)+'<div style="min-width:0;flex:1"><div class="social-brand-title">'+esc(b.name)+'</div><div class="social-brand-sub">'+esc(b.company)+' · '+esc(b.region)+' · '+esc(b.focus)+'</div></div><span class="platform-status common">'+x.accounts.length+' 个入口</span></div><p class="social-brand-note">'+esc(b.note)+'</p><div class="social-accounts-grid">'+accountCards+'</div></article>'
 }).join('');
 var postCards=posts.map(function(p){
  var postLinkLabel=(p.platform==='LinkedIn'||p.platform==='B站')?'打开官方动态页':'查看原始宣传内容';
  var metric=p.metrics?'<span class="pill">赞 '+Number(p.metrics.likes||0).toLocaleString('zh-CN')+'</span><span class="pill">评 '+Number(p.metrics.comments||0).toLocaleString('zh-CN')+'</span><span class="pill">分享 '+Number(p.metrics.shares||0).toLocaleString('zh-CN')+'</span>':'';
  return '<article class="social-post-card"><div class="social-post-meta"><span class="pill blue">'+esc(p.brand)+'</span><span class="pill">'+esc(p.platform)+'</span><span class="pill">'+esc(p.type)+'</span><span style="font-size:9px;color:var(--muted2)">'+esc(p.publishedLabel)+'</span></div><h3>'+esc(p.title)+'</h3><p>'+esc(p.note||'官方账号宣传动态。')+'</p><div class="social-post-meta" style="margin-top:9px">'+metric+'</div><a href="'+safeUrl(p.url)+'" target="_blank" rel="noopener noreferrer">'+postLinkLabel+' ↗</a>'+(p.sourceUrl&&p.sourceUrl!==p.url?'<a style="margin-left:12px" href="'+safeUrl(p.sourceUrl)+'" target="_blank" rel="noopener noreferrer">采集与核验来源 ↗</a>':'')+'</article>'
 }).join('');
 return pageHead('官方社媒监控','追踪竞品官方账号在哪些平台发声、宣传什么功能，以及公开粉丝规模。',''+brands.length+' 家品牌 · '+allAccounts.length+' 个账号')+
 '<div class="social-summary"><div class="social-summary-card"><span>监控品牌</span><strong>'+brands.length+'</strong></div><div class="social-summary-card"><span>账号入口</span><strong>'+allAccounts.length+'</strong></div><div class="social-summary-card"><span>已核验账号</span><strong>'+verified+'</strong></div><div class="social-summary-card"><span>粉丝数快照</span><strong>'+snapshots+'</strong></div></div>'+
 '<div class="social-disclaimer"><strong>数据口径：</strong>只把官网链接、平台认证或可追溯官方主页确认的账号标为已核验。粉丝数是带日期的公开快照，不是实时值；暂时无法读取的平台显示“未读取”，不把缺失值当作 0。待复核账号不会计入已核验数量。小红书与部分 X 账号目前仅提供检索入口，不冒充官方主页。</div>'+
 '<div class="section-head"><div><h2>官方账号库</h2><p>按平台筛选，查看账号主页与粉丝数快照。</p></div><span class="head-meta">'+(state.socialPlatform==='all'?'全部平台':esc(state.socialPlatform))+' · '+filteredBrands.length+' 家品牌</span></div>'+
 '<div class="tabs">'+tabs+'</div><div class="social-brand-grid">'+(brandCards||empty('当前筛选条件下没有已收录的账号。'))+'</div>'+
 '<div class="section-head"><div><h2>近期官方宣传</h2><p>模型发布、功能上新、产品接入和创作者活动。</p></div><span class="head-meta">'+posts.length+' 条可核验动态</span></div><div class="social-post-list">'+(postCards||empty('当前筛选条件下暂时没有官方宣传动态。'))+'</div>'+
 '<div class="footer"><span>粉丝数趋势需要连续快照；目前先展示已核验的公开历史值。</span><span>账号名单与来源可继续增删维护 · 数据更新 '+esc(state.social.updatedAt||'')+'</span></div>'
}

content.addEventListener('click',function(e){
 var b=e.target.closest('[data-view]');if(b){setView(b.dataset.view);return}
 b=e.target.closest('[data-timeline-cat]');if(b){state.timelineCategory=b.dataset.timelineCat;render();return}
 b=e.target.closest('[data-model-cat]');if(b){state.modelCategory=b.dataset.modelCat;render();return}
 b=e.target.closest('[data-region]');if(b){state.regionFilter=b.dataset.region;render();return}
 b=e.target.closest('[data-access]');if(b){state.accessFilter=b.dataset.access;render();return}
 b=e.target.closest('[data-rank-cat]');if(b){state.rankTab=b.dataset.rankCat;var c=rankCategory();state.rankSub=c&&c.boards.length?c.boards[0].id:'';state.rankPage=0;state.rankExpanded=true;render();return}
 b=e.target.closest('[data-rank-sub]');if(b){state.rankSub=b.dataset.rankSub;state.rankPage=0;state.rankExpanded=true;render();return}
 b=e.target.closest('[data-rank-page]');if(b){state.rankPage=Math.max(0,state.rankPage+Number(b.dataset.rankPage));render();return}
 b=e.target.closest('[data-rank-expand]');if(b){state.rankExpanded=!state.rankExpanded;render();return}
 b=e.target.closest('[data-rank-sources]');if(b){state.rankSourcesOpen=!state.rankSourcesOpen;render();return}
 b=e.target.closest('[data-news-all]');if(b){state.newsExpanded=!state.newsExpanded;render();return}
 b=e.target.closest('[data-aihot-cat]');if(b){state.aihotCategory=b.dataset.aihotCat;render();return}
 b=e.target.closest('[data-aihot-refresh]');if(b){loadAiHot();return}
 b=e.target.closest('[data-aipick-cat]');if(b){state.aipickCategory=b.dataset.aipickCat;render();return}
 b=e.target.closest('[data-aipick-refresh]');if(b){loadAiPick();return}
 b=e.target.closest('[data-aipick-copy]');if(b){copyAiPickCard(b.dataset.aipickCopy,b);return}
 b=e.target.closest('[data-topic]');if(b){state.activeTopic=b.dataset.topic;render();return}
 b=e.target.closest('[data-topic-back]');if(b){state.activeTopic=null;render();return}
 b=e.target.closest('[data-platform-cat]');if(b){state.platformCategory=b.dataset.platformCat;render();return}
 b=e.target.closest('[data-social-platform]');if(b){state.socialPlatform=b.dataset.socialPlatform;render();return}
});
document.querySelectorAll('#sidebar [data-view]').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.view)})});
document.getElementById('searchInput').addEventListener('input',function(e){state.query=e.target.value;render()});
document.getElementById('mobileMenu').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('open')});
loadData().catch(function(e){content.innerHTML='<div class="empty">本地数据加载失败：'+esc(e.message)+'。请确认通过本地 HTTP 服务打开 preview-v4.html。</div>'});
</script>
