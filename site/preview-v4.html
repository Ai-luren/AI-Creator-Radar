<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI视频创作台</title>
<meta name="description" content="人工智能模型动态、专业排行榜、公司编年史、今日早报与创作导航。">
<style>
:root{--bg:#f5f5f7;--paper:#fff;--paper2:#f1f2f4;--ink:#1d1d1f;--muted:#6e6e73;--muted2:#73777d;--line:#e3e3e8;--blue:#2676df;--blue2:#edf5ff;--blueLine:#d7e7fb;--green:#18734f;--amber:#8a5a13;--shadow:0 2px 8px rgba(29,29,31,.045);--radius:14px;--radius-control:10px;--radius-card:14px;--radius-panel:16px;--control-height:38px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--side:244px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 24px}

.nav-scroll{overflow:auto;flex:1;padding:0 0 14px}
.nav-group{margin:0 0 21px}

.nav{display:grid;gap:3px}

.nav button:hover{background:#f5f8fb;color:var(--ink)}

.nav-icon{width:19px;height:19px;display:grid;place-items:center;flex:none}

.main{margin-left:var(--side);min-height:100vh}
.topbar{height:64px;position:sticky;top:0;z-index:10;background:rgba(245,247,249,.91);backdrop-filter:blur(14px);border-bottom:1px solid rgba(225,231,236,.8);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:18px}
.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:700}
.preview-label{margin-left:9px;border:1px solid var(--blueLine);background:var(--blue2);color:var(--blue);font-size:9px;padding:3px 7px;border-radius:99px;font-weight:750}
.top-right{display:flex;align-items:center;gap:10px}
.search{width:min(340px,38vw);height:36px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:0 13px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--ink)}
.content{max-width:1480px;margin:0 auto;padding:30px 34px 60px}

.hero:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;border:1px solid rgba(56,126,210,.1);right:6%;top:-95px;box-shadow:0 0 0 32px rgba(56,126,210,.025),0 0 0 68px rgba(56,126,210,.02)}

.tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.tab{border:1px solid var(--line);background:#fff;color:#65727e;border-radius:99px;padding:7px 13px;font-size:11px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.tab:hover{border-color:#cbd9e7;color:var(--ink)}
.tab.active{background:var(--blue2);border-color:var(--blueLine);color:#236bc4;font-weight:750}
.tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.release-tabs{margin-bottom:16px}.release-company{margin:0 0 24px}.release-company-head{display:flex;align-items:center;gap:9px;margin:0 0 10px}.release-company-head h2{font-size:14px;margin:0;font-weight:780}.release-company-head span{font-size:10px;color:var(--muted)}.release-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.release-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,.42fr);align-items:start;column-gap:24px;min-width:0;border:1px solid var(--line);background:#fff;border-radius:13px;padding:15px 17px;box-shadow:var(--shadow)}.release-meta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}.release-meta time{font-size:10px;color:var(--muted);white-space:nowrap}.release-card h3{grid-column:1;font-size:14px;line-height:1.45;margin:11px 0 5px}.release-card p{grid-column:1;grid-row:3;font-size:11px;line-height:1.7;color:var(--muted);margin:0}.release-access{grid-column:2;grid-row:2;padding-top:12px;font-size:10px;line-height:1.6;color:#44586a}.release-card a{grid-column:2;grid-row:3;display:inline-block;align-self:end;justify-self:start;color:var(--blue);text-decoration:none;font-size:10px;font-weight:700}.release-card .release-model-link{grid-column:2;grid-row:4;justify-self:start;margin-top:7px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--blue);font-size:10px;font-weight:700;text-align:left}@media(max-width:600px){.release-card{grid-template-columns:minmax(0,1fr);row-gap:0}.release-meta{grid-column:1}.release-card h3,.release-card p,.release-access,.release-card a{grid-column:1;grid-row:auto}.release-access{padding-top:10px}.release-card a{margin-top:9px}.release-card .release-model-link{grid-column:1;grid-row:auto;margin-top:8px}}
.timeline{position:relative;margin:5px 0 0 8px;padding-left:26px}
.timeline:before{content:"";position:absolute;left:7px;top:7px;bottom:8px;width:1px;background:#dce5ec}
.month-group{margin:0 0 25px}
.month-count{font-size:10px;font-weight:500;color:var(--muted);margin-left:6px}.month-empty{padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px;background:rgba(255,255,255,.55)}.month-title{font-size:14px;font-weight:780;margin:0 0 11px;letter-spacing:-.2px}
.timeline-item{position:relative;display:grid;grid-template-columns:74px minmax(0,1fr);gap:13px;padding:0 0 15px}
.timeline-item:before{content:"";position:absolute;left:-23px;top:7px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #5b9ce4;box-shadow:0 0 0 3px var(--bg)}
.timeline-date{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.timeline-card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);min-width:0}

.practice-category-tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin:5px 0 15px;padding-bottom:9px}.practice-category-tab{min-width:70px;border:1px solid transparent;border-radius:8px;background:transparent;padding:8px 15px;color:var(--muted);font-size:12px;font-weight:700}.practice-category-tab:hover{background:#fff;color:var(--ink)}.practice-category-tab.active{border-color:var(--blueLine);background:var(--blue2);color:var(--blue)}.practice-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.practice-toolbar>span{color:var(--muted);font-size:10px;font-weight:700}.practice-toolbar .filter-row{margin:0}.practice-notice{margin:0 0 12px;color:var(--muted2);font-size:10px;line-height:1.6}
