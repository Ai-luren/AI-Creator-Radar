function saveEdited(kind,id,data){var p=state.personal;if(id&&base[kind].some(function(x){return x.id===id;})){p[kind+'Overrides']=p[kind+'Overrides']||{};p[kind+'Overrides'][id]=data;}else{p[kind]=p[kind]||[];var idx=p[kind].findIndex(function(x){return x.id===id;});if(idx>=0)p[kind][idx]=data;else p[kind].push(data);}if(kind==='prompts'&&data.exampleImage)p.prompts=p.prompts||[];savePersonal();}
function closeModal(){overlay.classList.remove('open');modalBody.innerHTML='';}
function compressImage(file){return new Promise(function(resolve,reject){var reader=new FileReader();reader.onerror=reject;reader.onload=function(){var img=new Image();img.onerror=reject;img.onload=function(){var max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*scale),h=Math.round(img.height*scale),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/webp',.78));};img.src=reader.result;};reader.readAsDataURL(file);});}

function importData(e){var file=e.target.files&&e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.personal)throw new Error('格式不正确');state.personal=d.personal;savePersonal();loadState();render();notify('个人配置已导入');}catch(err){notify('导入失败：文件格式不正确');}};r.readAsText(file);e.target.value='';}
