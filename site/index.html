<html lang="zh-CN">
<head>

<title>AI视频创作台</title>
<meta name="description" content="人工智能模型动态、专业排行榜、公司编年史、今日早报与创作工具。">
<style>
:root{--bg:#f5f5f7;--paper:#fff;--paper2:#f1f2f4;--ink:#1d1d1f;--muted:#6e6e73;--muted2:#73777d;--line:#e3e3e8;--blue:#1764c0;--accent:#2676df;--text-title:28px;--text-section:18px;--text-row:15px;--text-body:14px;--text-meta:12px;--blue2:#edf5ff;--blueLine:#d7e7fb;--green:#18734f;--amber:#8a5a13;--shadow:0 2px 8px rgba(29,29,31,.045);--radius:14px;--radius-control:10px;--radius-card:14px;--radius-panel:16px;--control-height:38px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--side:244px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 24px}

.nav-scroll{overflow:auto;flex:1;padding:0 0 14px}
.nav-group{margin:0 0 21px}

.nav{display:grid;gap:3px}

.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:700}
.preview-label{margin-left:9px;border:1px solid var(--blueLine);background:var(--blue2);color:var(--blue);font-size:9px;padding:3px 7px;border-radius:99px;font-weight:750}
.top-right{display:flex;align-items:center;gap:10px}
.search{width:min(340px,38vw);height:36px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:0 13px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:var(--ink)}
.content{max-width:1480px;margin:0 auto;padding:30px 34px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:0 0 22px}

.head-meta{font-size:10px;color:var(--muted2);white-space:nowrap}
.hero{border:1px solid var(--line);border-radius:19px;background:linear-gradient(112deg,#fff 0%,#f8fbff 65%,#eff6ff 100%);padding:27px 30px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;border:1px solid rgba(56,126,210,.1);right:6%;top:-95px;box-shadow:0 0 0 32px rgba(56,126,210,.025),0 0 0 68px rgba(56,126,210,.02)}

.hero-bottom{display:flex;gap:18px;flex-wrap:wrap;margin-top:17px;color:var(--muted);font-size:10px;position:relative;z-index:1}

.section-action{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:700}
.tabs{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 16px}
.tab{border:1px solid var(--line);background:#fff;color:#65727e;border-radius:99px;padding:7px 13px;font-size:11px;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.tab:hover{border-color:#cbd9e7;color:var(--ink)}
.tab.active{background:var(--blue2);border-color:var(--blueLine);color:#236bc4;font-weight:750}
.tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.release-tabs{margin-bottom:16px}.release-company{margin:0 0 24px}.release-company-head{display:flex;align-items:center;gap:9px;margin:0 0 10px}.release-company-head h2{font-size:14px;margin:0;font-weight:780}.release-company-head span{font-size:10px;color:var(--muted)}.release-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.release-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,.42fr);align-items:start;column-gap:24px;min-width:0;border:1px solid var(--line);background:#fff;border-radius:13px;padding:15px 17px;box-shadow:var(--shadow)}.release-meta{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}.release-meta time{font-size:10px;color:var(--muted);white-space:nowrap}.release-card h3{grid-column:1;font-size:14px;line-height:1.45;margin:11px 0 5px}.release-card p{grid-column:1;grid-row:3;font-size:11px;line-height:1.7;color:var(--muted);margin:0}.release-access{grid-column:2;grid-row:2;padding-top:12px;font-size:10px;line-height:1.6;color:#44586a}.release-card a{grid-column:2;grid-row:3;display:inline-block;align-self:end;justify-self:start;color:var(--blue);text-decoration:none;font-size:10px;font-weight:700}.release-card .release-model-link{grid-column:2;grid-row:4;justify-self:start;margin-top:7px;border:0;background:transparent;padding:0;cursor:pointer;color:var(--blue);font-size:10px;font-weight:700;text-align:left}@media(max-width:600px){.release-card{grid-template-columns:minmax(0,1fr);row-gap:0}.release-meta{grid-column:1}.release-card h3,.release-card p,.release-access,.release-card a{grid-column:1;grid-row:auto}.release-access{padding-top:10px}.release-card a{margin-top:9px}.release-card .release-model-link{grid-column:1;grid-row:auto;margin-top:8px}}
.timeline{position:relative;margin:5px 0 0 8px;padding-left:26px}
.timeline:before{content:"";position:absolute;left:7px;top:7px;bottom:8px;width:1px;background:#dce5ec}
.month-group{margin:0 0 25px}
.month-count{font-size:10px;font-weight:500;color:var(--muted);margin-left:6px}.month-empty{padding:12px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px;background:rgba(255,255,255,.55)}.month-title{font-size:14px;font-weight:780;margin:0 0 11px;letter-spacing:-.2px}
.timeline-item{position:relative;display:grid;grid-template-columns:74px minmax(0,1fr);gap:13px;padding:0 0 15px}
.timeline-item:before{content:"";position:absolute;left:-23px;top:7px;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #5b9ce4;box-shadow:0 0 0 3px var(--bg)}
.timeline-date{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}

.model-grid,.platform-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}

.practice-model-section{margin-top:18px}
.practice-category{display:flex;align-items:center;gap:8px;margin:21px 0 9px;color:var(--ink);font-size:13px;font-weight:800;letter-spacing:-.01em}.practice-category span{color:var(--muted2);font-size:10px;font-weight:600}
.practice-category-tabs{display:flex;gap:7px;border-bottom:1px solid var(--line);margin:5px 0 15px;padding-bottom:9px}.practice-category-tab{min-width:70px;border:1px solid transparent;border-radius:8px;background:transparent;padding:8px 15px;color:var(--muted);font-size:12px;font-weight:700}.practice-category-tab:hover{background:#fff;color:var(--ink)}.practice-category-tab.active{border-color:var(--blueLine);background:var(--blue2);color:var(--blue)}.practice-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.practice-toolbar>span{color:var(--muted);font-size:10px;font-weight:700}.practice-toolbar .filter-row{margin:0}.practice-notice{margin:0 0 12px;color:var(--muted2);font-size:10px;line-height:1.6}

document.getElementById('globalSearchDialog').addEventListener('click',function(e){if(e.target===this){var r=this.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeGlobalSearch();return}var t=e.target.closest('[data-global-type]');if(t){globalType=t.dataset.globalType;globalActive=0;renderGlobalSearch();document.getElementById('globalSearchInput').focus();return}var b=e.target.closest('[data-global-result]');if(b)selectGlobal(Number(b.dataset.globalResult))});
document.getElementById('globalSearchInput').addEventListener('input',function(){globalActive=0;renderGlobalSearch()});
document.getElementById('globalSearchInput').addEventListener('keydown',function(e){if(e.isComposing)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();stepGlobal(e.key==='ArrowDown'?1:-1)}else if(e.key==='Enter'){e.preventDefault();selectGlobal(globalActive)}});
if(window.addEventListener){var scrollSaveTimer;function scheduleScrollSave(){clearTimeout(scrollSaveTimer);var url=window.location.search;scrollSaveTimer=setTimeout(function(){if(url===window.location.search)saveRoute(false)},120)}window.addEventListener('popstate',function(e){clearTimeout(scrollSaveTimer);restoreNavigation(e.state)});window.addEventListener('scroll',scheduleScrollSave,{passive:true});content.addEventListener('scroll',function(e){if(e.target.matches&&e.target.matches('.model-table-wrap'))scheduleScrollSave()},{capture:true,passive:true});window.addEventListener('pagehide',function(){clearTimeout(scrollSaveTimer);saveRoute(false)});}
var desktopNavCompact=false,navGroupClosed={};
function loadNavPreference(){
 try{desktopNavCompact=localStorage.getItem('radar.nav.compact')==='1';var saved=JSON.parse(localStorage.getItem('radar.nav.groups')||'{}');['daily','research','resources'].forEach(function(k){navGroupClosed[k]=saved&&saved[k]===true})}catch(e){}
}
function applyNavPreference(){
 if(!mobileNavMedia)return;
 var compact=desktopNavCompact&&!mobileNavMedia.matches,toggle=document.getElementById('desktopNavToggle');
 document.documentElement.classList.toggle('nav-compact',compact);
 toggle.setAttribute('aria-expanded',String(!compact));toggle.setAttribute('aria-label',compact?'展开侧边栏':'收起侧边栏');toggle.title=compact?'展开侧边栏':'收起侧边栏';
 document.querySelectorAll('[data-nav-group]').forEach(function(g){var k=g.dataset.navGroup,closed=!compact&&!!navGroupClosed[k];g.classList.toggle('group-closed',closed);g.querySelector('[data-nav-group-toggle]').setAttribute('aria-expanded',String(!closed))});
}
function saveNavPreference(){try{localStorage.setItem('radar.nav.compact',desktopNavCompact?'1':'0');localStorage.setItem('radar.nav.groups',JSON.stringify(navGroupClosed))}catch(e){}}
function revealActiveNav(){if(!mobileNavMedia)return;var active=document.querySelector('#sidebar [data-view="'+state.view+'"]'),g=active&&active.closest('[data-nav-group]');if(g&&navGroupClosed[g.dataset.navGroup]){navGroupClosed[g.dataset.navGroup]=false;saveNavPreference();applyNavPreference()}}
var mobileNavOpen=false;
var mobileNavMedia=typeof window.matchMedia==='function'?window.matchMedia('(max-width:760px)'):null;
function setMobileNav(open,restore){
 if(!mobileNavMedia)return;
 var wasOpen=mobileNavOpen,sidebar=document.getElementById('sidebar'),toggle=document.getElementById('mobileMenu'),backdrop=document.getElementById('navBackdrop');
 mobileNavOpen=Boolean(open&&mobileNavMedia.matches);
 sidebar.classList.toggle('open',mobileNavOpen);
 toggle.setAttribute('aria-expanded',String(mobileNavOpen));
 toggle.setAttribute('aria-label',mobileNavOpen?'关闭导航':'打开导航');
 backdrop.hidden=!mobileNavOpen;
 document.body.classList.toggle('nav-open',mobileNavOpen);
 document.querySelector('main').inert=mobileNavOpen;
 sidebar.inert=mobileNavMedia.matches&&!mobileNavOpen;
 if(mobileNavOpen){
  // Resolve the visibility/inert change before focusing, and retry after paint if necessary.
  var close=document.getElementById('mobileNavClose');close.getBoundingClientRect();close.focus({preventScroll:true});
  if(document.activeElement!==close)window.requestAnimationFrame(function(){if(mobileNavOpen)close.focus({preventScroll:true})});
 }else if(wasOpen&&restore&&mobileNavMedia.matches){
  toggle.getBoundingClientRect();toggle.focus({preventScroll:true});
  if(document.activeElement!==toggle)window.requestAnimationFrame(function(){if(!mobileNavOpen&&mobileNavMedia.matches)toggle.focus({preventScroll:true})});
 }
}
document.getElementById('desktopNavToggle').addEventListener('click',function(){desktopNavCompact=!desktopNavCompact;saveNavPreference();applyNavPreference()});
document.querySelectorAll('[data-nav-group-toggle]').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.navGroupToggle;navGroupClosed[k]=!navGroupClosed[k];saveNavPreference();applyNavPreference()})});
document.getElementById('mobileMenu').addEventListener('click',function(){setMobileNav(!mobileNavOpen,true)});
document.getElementById('mobileNavClose').addEventListener('click',function(){setMobileNav(false,true)});
document.getElementById('navBackdrop').addEventListener('click',function(){setMobileNav(false,true)});
document.addEventListener('keydown',function(e){
 if(!mobileNavOpen)return;
 if(e.key==='Escape'){e.preventDefault();setMobileNav(false,true);return}
 if(e.key!=='Tab')return;
 var controls=Array.from(document.getElementById('sidebar').querySelectorAll('button:not([disabled])')).filter(function(x){return x.getClientRects().length>0});
 if(!controls.length)return;var first=controls[0],last=controls[controls.length-1],active=document.activeElement;
 if(e.shiftKey&&(active===first||!controls.includes(active))){e.preventDefault();last.focus()}
 else if(!e.shiftKey&&(active===last||!controls.includes(active))){e.preventDefault();first.focus()}
});
if(mobileNavMedia){loadNavPreference();applyNavPreference();revealActiveNav();setMobileNav(false,false);var navViewportChange=function(){setMobileNav(false,false);applyNavPreference();revealActiveNav()};if(mobileNavMedia.addEventListener)mobileNavMedia.addEventListener('change',navViewportChange);else mobileNavMedia.addListener(navViewportChange)}
loadData().catch(function(e){if(location.protocol==='file:'){var localUrl='http://127.0.0.1:8080/';content.innerHTML='<section class="local-load-error"><h2>正在连接本机预览</h2><p>若本机预览服务已启动，页面会自动跳转；否则请双击项目根目录的启动命令打开完整页面。</p><a href="'+localUrl+'">重试打开 ↗</a></section>';fetch(localUrl,{mode:'no-cors',cache:'no-store'}).then(function(){location.replace(localUrl)}).catch(function(){}) ;return}content.innerHTML='<div class="empty">数据加载失败：'+esc(e.message)+'。请确认网络连接后刷新页面。</div>'});
