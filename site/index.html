<style>
:root{color-scheme:light;--bg:#f5f6f7;--paper:#fff;--paper-2:#fafbfc;--ink:#202733;--muted:#78818d;--line:#e8ebef;--blue:#416fce;--blue-soft:#edf3ff;--green:#25836a;--amber:#a86a1d;--red:#bd5656;--shadow:0 10px 30px rgba(30,45,65,.045);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:236px;padding:26px 17px 20px;background:rgba(255,255,255,.86);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:10;backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:12px;padding:3px 9px 28px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#5d85df,#315bb3);display:grid;place-items:center;color:white;box-shadow:0 7px 16px rgba(65,111,206,.22)}.brand-name{font-weight:750;font-size:15px;letter-spacing:-.3px}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.nav-label{font-size:10px;color:#9aa2ad;letter-spacing:1.5px;padding:8px 12px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#697482;text-align:left;padding:10px 12px;border-radius:11px;display:flex;align-items:center;gap:11px;font-weight:560;transition:.18s}.nav button:hover{background:#f4f6f9;color:var(--ink)}.nav button.active{background:var(--blue-soft);color:#315eb8}.nav-icon{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:15px 11px 0;border-top:1px solid var(--line)}.status-line{display:flex;align-items:center;gap:8px;color:#687482;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#3aa17e;box-shadow:0 0 0 3px #e8f5f0}.side-note{font-size:11px;color:#9aa2ad;margin-top:8px}.main{margin-left:236px;min-height:100vh}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 42px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.66);backdrop-filter:blur(16px);position:sticky;top:0;z-index:8}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--ink);font-weight:650}.top-actions{display:flex;align-items:center;gap:12px}.search{width:min(340px,34vw);height:38px;border:1px solid var(--line);background:white;border-radius:11px;display:flex;align-items:center;gap:8px;padding:0 11px;color:#89929d}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink);font-size:12px}.icon-btn{border:1px solid var(--line);background:white;width:38px;height:38px;border-radius:11px;color:#66717e}.icon-btn:hover{border-color:#c9d5e9;color:var(--blue)}.content{max-width:1320px;margin:0 auto;padding:35px 42px 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.eyebrow{color:var(--blue);font-size:10px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:7px}.page-title{font-size:28px;line-height:1.2;letter-spacing:-1px;margin:0;font-weight:760}.page-desc{margin:9px 0 0;color:var(--muted);font-size:13px}.date-note{font-size:11px;color:#9099a5;white-space:nowrap}.hero{position:relative;overflow:hidden;padding:29px 32px;border-radius:22px;background:linear-gradient(115deg,#eef3fb 0%,#f8fafc 57%,#f4f6f8 100%);border:1px solid #e6ebf2;margin-bottom:22px}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:7%;top:-145px;border:1px solid rgba(78,119,190,.16);box-shadow:0 0 0 26px rgba(78,119,190,.035),0 0 0 56px rgba(78,119,190,.025)}.hero-kicker{font-size:10px;letter-spacing:1.8px;color:#6681ad;font-weight:750}.hero h1{font-size:26px;line-height:1.35;letter-spacing:-.8px;margin:8px 0 8px;max-width:650px}.hero p{margin:0;color:#6e7b8d;font-size:13px;max-width:660px}.hero-meta{display:flex;align-items:center;gap:14px;margin-top:20px;color:#718097;font-size:11px}.hero-meta span{display:flex;align-items:center;gap:6px}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:10px;font-weight:650;background:#f1f3f6;color:#687482}.pill.blue{background:#eaf1ff;color:#4269b5}.pill.green{background:#eaf6f1;color:#25836a}.pill.amber{background:#fff4e6;color:#a86a1d}.pill.red{background:#fff0f0;color:#b34d4d}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:26px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px 18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.stat-icon{width:29px;height:29px;display:grid;place-items:center;background:#f3f6fb;border-radius:9px;font-size:14px}.stat-value{font-size:26px;line-height:1.2;font-weight:760;letter-spacing:-.8px;margin-top:10px}.stat-foot{font-size:10px;color:#98a1ac;margin-top:5px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 13px}.section-head h2{font-size:15px;margin:0;font-weight:730}.section-head p{font-size:11px;color:var(--muted);margin:3px 0 0}.text-link{border:0;background:none;color:var(--blue);font-size:11px;font-weight:650;padding:6px}.feed-list{display:grid;gap:10px}.news-card{background:white;border:1px solid var(--line);border-radius:15px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;transition:box-shadow .18s,border-color .18s}.news-card:hover{border-color:#d6e0f0;box-shadow:var(--shadow)}.news-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;color:#8b95a1}.news-title{font-size:14px;font-weight:700;line-height:1.5;margin:7px 0 5px;color:#293342}.news-title a{color:inherit;text-decoration:none}.news-title a:hover{color:var(--blue)}.news-summary{font-size:12px;color:#788391;line-height:1.65;margin:0;max-width:900px}.news-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;color:#7b8795;background:#f4f6f8;border-radius:6px;padding:3px 7px}.news-actions{display:flex;align-items:flex-start;gap:7px}.save-btn{border:1px solid var(--line);background:white;color:#9aa3ae;border-radius:9px;width:31px;height:31px}.save-btn.saved{color:#d39a3e;background:#fff9ed;border-color:#f3dfba}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.filter-btn{border:1px solid var(--line);background:white;color:#7a8490;border-radius:99px;padding:6px 12px;font-size:11px}.filter-btn.active{border-color:#c9d8f3;background:#edf3ff;color:#3e67b7;font-weight:700}.empty{background:white;border:1px dashed #dce2e9;border-radius:15px;padding:34px;text-align:center;color:#87919d;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.catalog-card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.catalog-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.catalog-card h3{font-size:14px;margin:0 0 4px}.catalog-card .sub{font-size:10px;color:#8c96a2}.catalog-card p{font-size:12px;color:#77828f;line-height:1.65;margin:11px 0}.focus-list{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}.card-link{color:var(--blue);text-decoration:none;font-size:11px;font-weight:650}.card-link:hover{text-decoration:underline}.prompt-card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.prompt-card h3{font-size:14px;margin:8px 0 4px}.prompt-card p{font-size:11px;color:#828d99;margin:0 0 11px}.prompt-text{max-height:150px;overflow:auto;white-space:pre-wrap;background:#f7f8fa;border:1px solid #edf0f3;border-radius:10px;padding:11px;color:#536070;font-size:11px;line-height:1.7}.copy-btn{margin-top:10px;border:1px solid #dce5f3;background:#f7faff;color:#4269b5;border-radius:9px;padding:7px 11px;font-size:11px;font-weight:650}.copy-btn:hover{background:#edf3ff}.source-row{display:grid;grid-template-columns:1.5fr .8fr .7fr 1.2fr;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #eff1f3;font-size:11px}.source-row:last-child{border-bottom:0}.source-name{font-weight:650;color:#374252}.source-muted{color:#87919d}.source-list{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.footer-note{margin-top:30px;padding-top:17px;border-top:1px solid var(--line);font-size:10px;color:#9aa2ad;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer-note a{color:#7b8ca8;text-decoration:none}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#273243;color:white;padding:9px 15px;border-radius:10px;font-size:12px;box-shadow:0 8px 22px #1823342e;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.loading{padding:35px;text-align:center;color:#8c96a2;font-size:12px}
@media(max-width:1050px){.content{padding:28px 26px 50px}.topbar{padding:0 26px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.sidebar{position:sticky;top:0;width:auto;height:auto;padding:10px 12px 8px;border-right:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94)}.brand{padding:0 4px 9px}.brand-mark{width:31px;height:31px;border-radius:10px}.brand-name{font-size:13px}.brand-sub{font-size:9px}.nav-label,.side-bottom{display:none}.nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;padding:7px 10px;font-size:11px;gap:6px}.nav-icon{font-size:13px;width:auto}.main{margin-left:0}.topbar{height:58px;padding:0 15px;position:relative}.crumb{display:none}.top-actions{width:100%}.search{width:100%;height:36px}.content{padding:23px 15px 40px}.page-head{align-items:flex-start;flex-direction:column;gap:7px}.page-title{font-size:24px}.hero{padding:22px 20px;border-radius:17px}.hero h1{font-size:22px}.hero:after{right:-100px}.stats{gap:8px}.stat{padding:13px}.stat-value{font-size:23px}.grid{grid-template-columns:1fr}.news-card{padding:14px;grid-template-columns:1fr}.news-actions{order:-1;justify-content:flex-end;margin-bottom:-25px}.source-row{grid-template-columns:1fr auto;gap:5px}.source-row .source-kind{display:none}.footer-note{font-size:9px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">⌁</div>
      <div><div class="brand-name">AI Creator Radar</div><div class="brand-sub">Creator intelligence</div></div>
    </div>
    <div class="nav-label">INTELLIGENCE</div>
    <nav class="nav" id="nav">
      <button class="active" data-view="overview"><span class="nav-icon">◫</span>今日总览</button>
      <button data-view="news"><span class="nav-icon">▤</span>全部资讯</button>
      <button data-view="models"><span class="nav-icon">✳</span>模型上新</button>
      <button data-view="competitors"><span class="nav-icon">◎</span>竞品动态</button>
      <button data-view="prompts"><span class="nav-icon">⌘</span>提示词库</button>
      <button data-view="tools"><span class="nav-icon">▦</span>工具软件</button>
      <button data-view="sources"><span class="nav-icon">⌁</span>信源状态</button>
    </nav>
    <div class="side-bottom">
      <div class="status-line"><span class="dot"></span><span id="side-status">等待首次采集</span></div>
      <div class="side-note">Public feeds · No LLM tokens</div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb">AI CREATOR RADAR <span style="color:#c3cad2"> / </span><strong id="crumb-title">今日总览</strong></div>
      <div class="top-actions">
        <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索资讯、模型、竞品、提示词…" autocomplete="off"></label>
        <button class="icon-btn" id="refresh" title="重新读取数据" aria-label="重新读取数据">↻</button>
      </div>
    </header>
    <div class="content" id="content"><div class="loading">正在载入情报数据…</div></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
  'use strict';
  var state={view:'overview',query:'',filter:'all',news:{items:[],stats:{}},status:{sources:[]},sources:{sources:[]},prompts:[],tools:[],competitors:[],saved:new Set()};
  var labels={overview:'今日总览',news:'全部资讯',models:'模型上新',competitors:'竞品动态',prompts:'提示词库',tools:'工具软件',sources:'信源状态'};
  var content=document.getElementById('content');
  var toastTimer;
  try{state.saved=new Set(JSON.parse(localStorage.getItem('acr-saved')||'[]'));}catch(e){}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function safeUrl(v){try{var u=new URL(v,location.href);return (u.protocol==='https:'||u.protocol==='http:')?u.href:'#';}catch(e){return '#';}}
  function date(v){if(!v)return '时间未知';var d=new Date(v);if(isNaN(d))return '时间未知';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);}
  function day(v){if(!v)return '—';var d=new Date(v);if(isNaN(d))return '—';return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'long',day:'numeric'}).format(d);}
  function ago(v){if(!v)return '尚未运行';var n=Date.now()-new Date(v).getTime();if(!isFinite(n)||n<0)return date(v);var m=Math.floor(n/60000);if(m<60)return m+' 分钟前';var h=Math.floor(m/60);if(h<24)return h+' 小时前';return Math.floor(h/24)+' 天前';}
  function notify(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},1900);}
  function setView(view){state.view=view;state.filter='all';document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===view);});document.getElementById('crumb-title').textContent=labels[view]||'今日总览';render();}
  function allItems(){return state.news.items||[];}
  function filteredItems(category){var q=state.query.trim().toLowerCase();return allItems().filter(function(item){var categoryOk=!category||item.category===category;var filterOk=state.filter==='all'||item.priority===state.filter;var hay=[item.title,item.summary,item.focus,(item.tags||[]).join(' '),(item.sources||[]).join(' ')].join(' ').toLowerCase();return categoryOk&&filterOk&&(!q||hay.indexOf(q)>-1);});}
  function priorityPill(p){if(p==='high')return '<span class="pill red">重点</span>';if(p==='medium')return '<span class="pill amber">关注</span>';return '';}
  function categoryPill(c){var map={models:'模型',competitors:'竞品',software:'软件',industry:'行业'};return '<span class="pill">'+(map[c]||'资讯')+'</span>';}
  function newsCard(item){var saved=state.saved.has(item.id);var tags=(item.tags||[]).slice(0,4).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');var sources=(item.sources||[]).join(' · ');return '<article class="news-card"><div><div class="news-meta">'+categoryPill(item.category)+' '+priorityPill(item.priority)+'<span>'+esc(sources||'未知来源')+'</span><span>· '+date(item.publishedAt)+'</span></div><h3 class="news-title"><a href="'+safeUrl(item.url)+'" target="_blank" rel="noopener noreferrer">'+esc(item.title)+'</a></h3><p class="news-summary">'+esc(item.summary||'打开原文查看详情。')+'</p><div class="news-tags">'+tags+'</div></div><div class="news-actions"><button class="save-btn '+(saved?'saved':'')+'" data-save="'+esc(item.id)+'" title="'+(saved?'取消收藏':'收藏')+'">'+(saved?'★':'☆')+'</button></div></article>';}
  function newsList(items){if(!items.length)return '<div class="empty">暂时没有匹配的资讯。定时采集完成后，新内容会自动出现在这里。</div>';return '<div class="feed-list">'+items.map(newsCard).join('')+'</div>';}
  function filterBar(){return '<div class="filters"><button class="filter-btn '+(state.filter==='all'?'active':'')+'" data-filter="all">全部优先级</button><button class="filter-btn '+(state.filter==='high'?'active':'')+'" data-filter="high">重点</button><button class="filter-btn '+(state.filter==='medium'?'active':'')+'" data-filter="medium">关注</button><button class="filter-btn '+(state.filter==='normal'?'active':'')+'" data-filter="normal">一般</button></div>';}
  function pageHead(title,desc,right){return '<div class="page-head"><div><div class="eyebrow">CREATOR INTELLIGENCE</div><h1 class="page-title">'+title+'</h1><p class="page-desc">'+desc+'</p></div><div class="date-note">'+(right||'')+'</div></div>';}
  function stat(label,value,foot,icon){return '<div class="stat"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-foot">'+foot+'</div></div>';}
  function overview(){var items=allItems();var model=items.filter(function(x){return x.category==='models';}).length;var comp=items.filter(function(x){return x.category==='competitors';}).length;var soft=items.filter(function(x){return x.category==='software';}).length;var hi=items.filter(function(x){return x.priority==='high';}).slice(0,5);var latest=items.slice(0,7);var status=state.status.checkedAt||state.news.generatedAt;return '<section class="hero"><div class="hero-kicker">AI VIDEO · MODEL · CREATOR ECOSYSTEM</div><h1>让重要的 AI 创作动态，<br>主动来到你的工作台。</h1><p>模型发布、竞品变化、创作方法与工具更新。自动采集公开信源，按主题归档，留存历史记录。</p><div class="hero-meta"><span>◉ '+(status?'最近更新 '+ago(status):'等待首次采集')+'</span><span>◌ '+(state.sources.sources||[]).length+' 个订阅信源</span><span class="pill green">无模型 Token</span></div></section><div class="stats">'+stat('模型与厂商动态',model,'来自官方博客与发布信息','✳')+stat('竞品动态',comp,'AI 视频产品与平台观察','◎')+stat('软件与开发工具',soft,'版本与开源项目更新','▦')+stat('已收藏资讯',state.saved.size,'保存在当前浏览器','★')+'</div><div class="section-head"><div><h2>优先关注</h2><p>基于标题关键词的规则标记，不使用 AI 自动判断</p></div><button class="text-link" data-view="news">查看全部 →</button></div>'+newsList(hi)+'<div class="section-head"><div><h2>最新动态</h2><p>按来源发布时间倒序</p></div><button class="text-link" data-view="news">进入资讯流 →</button></div>'+newsList(latest)+'</section>';}
  function newsView(category,title,desc){var items=filteredItems(category);return pageHead(title,desc,'共 '+items.length+' 条')+filterBar()+newsList(items);}
  function competitorsView(){var cards=state.competitors.map(function(c){var focus=(c.focus||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');var url=c.url?safeUrl(c.url):safeUrl(c.watchUrl);return '<article class="catalog-card"><div class="catalog-top"><div><h3>'+esc(c.name)+'</h3><div class="sub">'+esc(c.region)+' · '+esc(c.position)+'</div></div><span class="pill blue">观察对象</span></div><p>'+esc(c.note)+'</p><div class="focus-list">'+focus+'</div><a class="card-link" href="'+url+'" target="_blank" rel="noopener noreferrer">官方入口 / 观察入口 ↗</a></article>';}).join('');var items=filteredItems('competitors');return pageHead('竞品动态','关注产品能力、模型接入、营销活动、创作者生态与版本变化。','观察名单 '+state.competitors.length+' 个')+'<div class="grid">'+cards+'</div><div class="section-head"><div><h2>竞品资讯流</h2><p>部分产品没有公开 RSS，当前通过公开新闻检索补充；请以官方公告为准。</p></div></div>'+filterBar()+newsList(items);}
  function promptsView(){var q=state.query.trim().toLowerCase();var categories=Array.from(new Set(state.prompts.map(function(p){return p.category;})));var items=state.prompts.filter(function(p){return !q||[p.title,p.description,p.category,p.template,(p.tags||[]).join(' ')].join(' ').toLowerCase().indexOf(q)>-1;});var chips='<div class="filters"><button class="filter-btn active" data-prompt-filter="all">全部模板</button>'+categories.map(function(c){return '<button class="filter-btn" data-prompt-filter="'+esc(c)+'">'+esc(c)+'</button>';}).join('')+'</div>';return pageHead('提示词库','把高频创作方法沉淀成可复制、可持续迭代的模板。','共 '+items.length+' 个模板')+chips+'<div class="grid">'+items.map(function(p){return '<article class="prompt-card" data-prompt-category="'+esc(p.category)+'"><span class="pill blue">'+esc(p.category)+'</span><h3>'+esc(p.title)+'</h3><p>'+esc(p.description)+'</p><div class="focus-list">'+(p.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div><div class="prompt-text">'+esc(p.template)+'</div><button class="copy-btn" data-copy="'+esc(p.id)+'">复制提示词</button></article>';}).join('')+'</div>';}
  function toolsView(){var software=filteredItems('software');return pageHead('工具软件','常用创作工具入口，以及可自动追踪的开源软件版本动态。','工具目录 '+state.tools.length+' 项')+'<div class="grid">'+state.tools.map(function(t){return '<article class="catalog-card"><div class="catalog-top"><div><h3>'+esc(t.name)+'</h3><div class="sub">'+esc(t.category)+' · '+esc(t.platform)+'</div></div><span class="pill">工具</span></div><p>'+esc(t.note)+'</p><a class="card-link" href="'+safeUrl(t.url)+'" target="_blank" rel="noopener noreferrer">打开官网 / 项目 ↗</a></article>';}).join('')+'</div><div class="section-head"><div><h2>版本更新</h2><p>目前优先覆盖 ComfyUI、Diffusers、yt-dlp 等公开发布源。</p></div></div>'+newsList(software);}
  function sourcesView(){var entries=state.status.sources||[];var total=entries.length;var ok=entries.filter(function(s){return !s.error;}).length;var rows=entries.map(function(s){return '<div class="source-row"><div><div class="source-name">'+esc(s.name)+'</div><div class="source-muted">'+esc(s.url)+'</div></div><div class="source-kind">'+esc(s.category)+' · '+esc(s.kind)+'</div><div>'+(s.error?'<span class="pill red">采集失败</span>':'<span class="pill green">正常</span>')+'</div><div class="source-muted">'+(s.error?esc(s.error):'最近 '+ago(s.lastSuccessAt)+' · '+(s.itemCount||0)+' 条')+'</div></div>';}).join('');return pageHead('信源状态','透明展示每个来源的采集结果。单个来源失败不会清空历史数据。','成功 '+ok+' / '+total)+'<div class="stats">'+stat('启用信源',total,'配置文件中的订阅源','⌁')+stat('本轮成功',ok,'成功返回可解析内容','✓')+stat('本轮失败',total-ok,'失败时保留上次有效数据','!')+stat('历史资讯',allItems().length,'去重后保留最近 60 天','▤')+'</div><div class="source-list">'+(rows||'<div class="empty">首次采集后会显示信源状态。</div>')+'</div><div class="footer-note"><span>信源配置：<a href="https://github.com/Ai-luren/AI-Creator-Radar/blob/main/config/sources.json" target="_blank" rel="noopener">config/sources.json</a></span><span>建议优先使用官方一手信源；新闻检索只作发现线索。</span></div>';}
  function render(){var view=state.view;if(view==='overview')content.innerHTML=overview();else if(view==='news')content.innerHTML=newsView(null,'全部资讯','统一查看模型、竞品、软件与行业动态。');else if(view==='models')content.innerHTML=newsView('models','模型上新','关注 GPT、Gemini、Claude、Seedance、Kling、开源模型等发布与版本变化。');else if(view==='competitors')content.innerHTML=competitorsView();else if(view==='prompts')content.innerHTML=promptsView();else if(view==='tools')content.innerHTML=toolsView();else if(view==='sources')content.innerHTML=sourcesView();bindContent();}
  function bindContent(){content.querySelectorAll('[data-view]').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.view);});});content.querySelectorAll('[data-filter]').forEach(function(b){b.addEventListener('click',function(){state.filter=b.dataset.filter;render();});});content.querySelectorAll('[data-save]').forEach(function(b){b.addEventListener('click',function(){var id=b.dataset.save;if(state.saved.has(id))state.saved.delete(id);else state.saved.add(id);localStorage.setItem('acr-saved',JSON.stringify(Array.from(state.saved)));render();notify(state.saved.has(id)?'已收藏':'已取消收藏');});});content.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){var p=state.prompts.find(function(x){return x.id===b.dataset.copy;});if(p)copyText(p.template);});});content.querySelectorAll('[data-prompt-filter]').forEach(function(b){b.addEventListener('click',function(){var category=b.dataset.promptFilter;content.querySelectorAll('[data-prompt-filter]').forEach(function(x){x.classList.toggle('active',x===b);});content.querySelectorAll('[data-prompt-category]').forEach(function(card){card.style.display=category==='all'||card.dataset.promptCategory===category?'':'none';});});});}
  function copyText(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){notify('提示词已复制');}).catch(function(){fallbackCopy(text);});}else fallbackCopy(text);}
  function fallbackCopy(text){var el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();try{document.execCommand('copy');notify('提示词已复制');}catch(e){notify('复制失败，请手动选择文本');}el.remove();}
  async function loadData(){content.innerHTML='<div class="loading">正在同步本地情报数据…</div>';var paths=['news.json','status.json','sources.json','prompts.json','tools.json','competitors.json'];var values=await Promise.all(paths.map(function(file){return fetch('./data/'+file+'?v='+Date.now()).then(function(r){if(!r.ok)throw new Error(file+' '+r.status);return r.json();}).catch(function(){return null;});}));state.news=values[0]||{items:[],stats:{}};state.status=values[1]||{sources:[]};state.sources=values[2]||{sources:[]};state.prompts=values[3]||[];state.tools=values[4]||[];state.competitors=values[5]||[];var checked=state.status.checkedAt||state.news.generatedAt;document.getElementById('side-status').textContent=checked?'最近采集 '+ago(checked):'等待首次采集';render();}
  document.getElementById('nav').addEventListener('click',function(e){var b=e.target.closest('[data-view]');if(b)setView(b.dataset.view);});
  document.getElementById('search').addEventListener('input',function(e){state.query=e.target.value;render();});
  document.getElementById('refresh').addEventListener('click',function(){loadData();notify('正在重新读取最新数据');});
  loadData();
})();
</script>
</body>
</html>
