    <text x="449" y="243" fill="#6e6e73" font-size="12">盲测偏好 · AA Elo</text>
    <text x="920" y="243" fill="#6e6e73" font-size="11">数据快照 2026-11-25</text>
    <text x="1128" y="243" text-anchor="end" fill="#2676df" font-size="11" font-weight="650">查看原榜 ↗</text>

    <!-- Ranking table with fixed column anchors -->
    <text x="280" y="282" fill="#73777d" font-size="11" font-weight="700">来源名次</text>
    <text x="390" y="282" fill="#73777d" font-size="11" font-weight="700">模型 / 厂商</text>
    <text x="810" y="282" fill="#73777d" font-size="11" font-weight="700">AA Elo · 95% CI</text>
    <text x="1038" y="282" fill="#73777d" font-size="11" font-weight="700">评测样本</text>
    <path d="M260 292h900" stroke="#e3e3e8"/>

    <text x="280" y="316" fill="#53616e" font-size="12" font-weight="650">#1</text>
    <text x="390" y="314" fill="#1d1d1f" font-size="14" font-weight="700">Wan 3.0</text>
    <text x="390" y="328" fill="#73777d" font-size="10">Alibaba</text>
    <text x="810" y="320" fill="#1d1d1f" font-size="13" font-weight="700">1175 · 1163–1187</text>
    <text x="1038" y="320" fill="#1d1d1f" font-size="12">9,201</text>
    <path d="M260 337h900" stroke="#eef0f2"/>

    <text x="280" y="359" fill="#53616e" font-size="12" font-weight="650">#3</text>
    <text x="390" y="357" fill="#1d1d1f" font-size="14" font-weight="700">MiniMax H3 (768p)</text>
    <text x="390" y="371" fill="#73777d" font-size="10">MiniMax</text>
    <text x="810" y="363" fill="#1d1d1f" font-size="13" font-weight="700">1164 · 1152–1176</text>
    <text x="1038" y="363" fill="#1d1d1f" font-size="12">9,362</text>
    <path d="M260 380h900" stroke="#eef0f2"/>

    <text x="280" y="400" fill="#53616e" font-size="12" font-weight="650">#5</text>
    <text x="390" y="398" fill="#1d1d1f" font-size="14" font-weight="700">Dreamina Seedance 2.5</text>
    <text x="390" y="412" fill="#73777d" font-size="10">ByteDance Seed</text>
    <text x="810" y="404" fill="#1d1d1f" font-size="13" font-weight="700">1154 · 1142–1166</text>
    <text x="1038" y="404" fill="#1d1d1f" font-size="12">9,260</text>
