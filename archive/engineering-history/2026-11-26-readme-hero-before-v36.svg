<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">AI 视频创作台能力榜单工作台</title>
  <desc id="desc">仿照实际工作台页面构图，包含侧栏导航、视频榜单页签、Artificial Analysis 来源快照与原榜排名表。</desc>
  <rect width="1200" height="450" rx="22" fill="#f5f5f7"/>
  <rect x="16" y="16" width="1168" height="418" rx="16" fill="#ffffff" stroke="#e3e3e8" stroke-width="2"/>

  <!-- Sidebar -->
  <path d="M232 17v416" stroke="#e3e3e8" stroke-width="2"/>
  <rect x="36" y="35" width="30" height="30" rx="9" fill="#1d1d1f"/>
  <text x="51" y="56" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12" font-weight="750">AI</text>
  <text x="77" y="56" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="740">AI 视频创作台</text>
  <path d="M36 79h178" stroke="#e3e3e8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
