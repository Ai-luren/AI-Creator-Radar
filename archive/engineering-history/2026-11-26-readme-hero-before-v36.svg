    <text x="50" y="130" fill="#53616e" font-size="14">近期上新</text>
    <text x="50" y="157" fill="#53616e" font-size="14">行业简报</text>
    <text x="50" y="184" fill="#53616e" font-size="14">官方账号监控</text>

    <text x="38" y="219" fill="#9aa5af" font-size="11" font-weight="750" letter-spacing=".6">研究</text>
    <text x="50" y="245" fill="#53616e" font-size="14">模型库</text>
    <text x="50" y="272" fill="#53616e" font-size="14">模型资料</text>
    <rect x="30" y="282" width="186" height="31" rx="9" fill="#eaf2fb"/>
    <rect x="30" y="282" width="3" height="31" rx="1.5" fill="#2676df"/>
    <text x="50" y="302" fill="#246bc4" font-size="14" font-weight="720">能力榜单</text>

    <text x="38" y="342" fill="#9aa5af" font-size="11" font-weight="750" letter-spacing=".6">创作</text>
    <text x="50" y="369" fill="#53616e" font-size="14">创作工具</text>
  </g>

  <!-- Top bar -->
  <rect x="234" y="18" width="948" height="46" fill="#ffffff"/>
  <path d="M234 64h948" stroke="#e3e3e8"/>
  <text x="258" y="47" fill="#6e6e73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13">AI 视频创作台</text>
  <text x="357" y="47" fill="#b1bac2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13">/</text>
  <text x="372" y="47" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="13" font-weight="700">能力榜单</text>
  <rect x="913" y="29" width="237" height="27" rx="14" fill="#ffffff" stroke="#e3e3e8"/>
  <circle cx="930" cy="42.5" r="5" fill="none" stroke="#8b929b" stroke-width="1.5"/>
  <path d="m934 46 4 4" stroke="#8b929b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="945" y="47" fill="#8b929b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="11">搜索模型、官方宣传与资源…</text>

