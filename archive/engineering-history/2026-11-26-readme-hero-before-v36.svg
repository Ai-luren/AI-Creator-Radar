    <rect x="594" y="139" width="65" height="30" rx="9" fill="#ffffff" stroke="#e3e3e8"/>
    <text x="626.5" y="159" text-anchor="middle" fill="#53616e" font-size="13">编程</text>

    <!-- Video task tabs -->
    <rect x="260" y="179" width="144" height="27" rx="8" fill="#2676df"/>
    <text x="332" y="197" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">有声文生视频</text>
    <rect x="410" y="179" width="144" height="27" rx="8" fill="#ffffff" stroke="#e3e3e8"/>
    <text x="482" y="197" text-anchor="middle" fill="#53616e" font-size="12">有声图生视频</text>

    <!-- Source snapshot header -->
    <rect x="260" y="216" width="900" height="44" rx="10" fill="#f7f9fb" stroke="#e3e3e8"/>
    <circle cx="278" cy="238" r="4" fill="#2676df"/>
